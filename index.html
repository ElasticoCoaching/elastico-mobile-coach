<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1b20"><title>Elastico · Mobile Coach 0.2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e6f2f3;background:#0b1b20;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:560px;margin:auto;min-height:100dvh;padding:20px 16px 104px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:11px;letter-spacing:2.2px;color:#83d0d8;font-weight:800}.muted{color:#91adb3}.small{font-size:12px}.h1{font-size:26px;font-weight:750;margin:8px 0 14px}.card{background:#162f37;border:1px solid #2a4b52;border-radius:15px;padding:15px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.pill{display:inline-block;border:1px solid #3a6b73;color:#b7dbe0;border-radius:20px;padding:4px 9px;font-size:11px}.btn{background:#237c89;border:1px solid #3499a5;color:white;border-radius:9px;padding:10px 12px;font-weight:650}.btn.sub{background:#18383f;border-color:#355b63}.btn.ghost{background:transparent;border-color:#385b62;color:#b6d7dc}.btn.tiny{padding:6px 8px;font-size:12px}.full{width:100%}select,input[type=file],input[type=date]{background:#10272e;color:#e6f2f3;border:1px solid #3a626b;border-radius:9px;padding:9px;max-width:100%}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d2229;border-top:1px solid #31505a;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}.nav-inner{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:#9bb6bb;padding:13px 4px 11px;font-size:12px}.nav button.active{color:#83dbe4;font-weight:800}.name{font-size:16px;font-weight:700}.detail{white-space:pre-wrap;line-height:1.5;color:#d5e8eb}details{border-top:1px solid #31505a;padding:11px 0}details:first-child{border:0}summary{cursor:pointer;font-weight:700}.empty{padding:25px 15px;text-align:center;color:#a9c4c8;border:1px dashed #3c6168;border-radius:14px}.attendance{display:flex;gap:5px}.attendance button{font-size:11px;padding:7px 8px;border-radius:7px;background:#19343c;border:1px solid #41646b;color:#c4dde1}.attendance button.selected{background:#2a8d99;border-color:#65bfc8;color:white}.label{display:block;margin:10px 0 5px;color:#aac5ca;font-size:12px}.warning{border-left:3px solid #e6b46b;padding:10px 12px;background:#302c22;color:#f0dcb8;border-radius:7px}.success{border-left:3px solid #65c8a7;padding:10px 12px;background:#153b36;color:#d0f3e5;border-radius:7px}.spacer{height:10px}.tag{background:#183d46;border-radius:5px;padding:3px 7px;margin:2px;display:inline-block;color:#a5e3ea;font-size:11px}h2{font-size:17px;margin:12px 0}.bar{height:7px;border-radius:8px;background:#33525a;overflow:hidden}.bar>div{background:#57b6c0;height:100%}</style></head><body><div id="app" class="app"></div><nav class="nav"><div class="nav-inner" id="nav"></div></nav><script>
'use strict';
const STORE='elastico-mobile-coach-0.1';const $=x=>document.querySelector(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function displayDate(value){const x=String(value||'');const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(x);return m?`${m[3]}/${m[2]}/${m[1]}`:x;} 
function displayStatus(s){return ({done:'Gennemført',partial:'Delvist gennemført',skipped:'Sprunget over',pending:'Afventer'})[s]||s;}
const today=()=>new Date().toLocaleDateString('en-CA');const asDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x||''))?x:null;
let state={data:null,team:'all',tab:'home',date:today(),selectedPlayer:null,attendance:{},importedAt:null};try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&typeof s==='object')state={...state,...s}}catch{}
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const arr=x=>Array.isArray(x)?x:[];
function teams(){const d=state.data||{};const list=arr(d.teams).map(t=>({id:String(t.id??t.name),name:String(t.name||t.label||'Hold')}));const names=[...new Set(arr(d.players).map(p=>p.team).filter(Boolean))];for(const n of names)if(!list.some(t=>t.name===n))list.push({id:String(n),name:String(n)});return list.sort((a,b)=>a.name.localeCompare(b.name,'da'))}
function teamName(id){return teams().find(t=>String(t.id)===String(id))?.name||String(id||'')}
function players(){return arr(state.data?.players).filter(p=>state.team==='all'||String(p.teamId)===String(state.team)||String(p.team)===teamName(state.team)||String(p.team)===String(state.team)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'da'))}
function eventTeam(e){if(e.teamId!=null)return String(e.teamId);if(e.team)return String(e.team);if(e.playerId!=null){const p=arr(state.data?.players).find(p=>String(p.id)===String(e.playerId));return String(p?.teamId??p?.team??'')}return ''}
function matchesTeam(e){if(state.team==='all')return true;const t=eventTeam(e);return t===String(state.team)||t===teamName(state.team)}
function allEvents(){const d=state.data||{};let e=arr(d.calendarEvents).map(x=>({...x,_source:'calendar'}));for(const s of arr(d.sessions))if(s.date)e.push({...s,_source:'session'});for(const p of arr(d.periodizations)){for(const slot of arr(p.slots)){let date=asDate(slot.date);if(!date&&p.startDate&&Number.isFinite(Number(slot.day))){let x=new Date(p.startDate+'T12:00:00');x.setDate(x.getDate()+Number(slot.day));date=x.toLocaleDateString('en-CA')}if(date)e.push({...slot,date,teamId:slot.teamId??p.teamId,_source:'periodization',periodizationName:p.name})}}const unique=new Map();for(const x of e){const k=[x._source,x.id??'',x.date,x.playerId??'',x.programId??'',x.name??x.title??''].join('|');if(!unique.has(k))unique.set(k,x)}return [...unique.values()].filter(x=>asDate(x.date)&&matchesTeam(x)).sort((a,b)=>a.date.localeCompare(b.date))}
function title(e){const d=state.data||{};const program=arr(d.programs).find(p=>String(p.id)===String(e.programId));return e.title||e.name||e.label||program?.name||e.kind||e.type||'Træningsaktivitet'}
function content(e){const d=state.data||{};const p=arr(d.programs).find(p=>String(p.id)===String(e.programId));let blocks=e.blocks||e.exercises||e.items||p?.blocks||p?.exercises||[];if(typeof blocks==='string')blocks=[blocks];return arr(blocks)}
function nav(){return ['home','calendar','team','data'].map((id,i)=>`<button class="${state.tab===id?'active':''}" onclick="tab('${id}')"><div style="font-size:20px">${['⌂','▦','♟','▥'][i]}</div>${['Hjem','Kalender','Hold','Data'][i]}</button>`).join('')}
function header(){return `<div class="top"><div><div class="brand">ELASTICO / MOBILE COACH 0.1</div><div class="small muted">Lokal prototype · Ingen synkronisering</div></div><button class="btn sub tiny" onclick="tab('data')">Import / eksport</button></div><div class="row"><label class="small muted" for="team">Hold</label><select id="team" onchange="chooseTeam(this.value)"><option value="all">Alle hold</option>${teams().map(t=>`<option value="${esc(t.id)}" ${state.team===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`}
function home(){const ev=allEvents().filter(x=>x.date>=today()).slice(0,4);return `<div class="h1">Træneroverblik</div>${!state.data?emptyImport():`<div class="card"><div class="muted small">AKTUELT HOLD</div><h2>${esc(state.team==='all'?'Alle hold':teamName(state.team))}</h2><div class="row"><div><div class="name">${players().length}</div><div class="small muted">spillere</div></div><div><div class="name">${allEvents().length}</div><div class="small muted">daterede aktiviteter*</div></div></div></div><h2>Kommende aktiviteter</h2>${ev.length?ev.map(x=>eventCard(x)).join(''):'<div class="empty">Ingen kommende daterede aktiviteter i de importerede data.</div>'}<button class="btn full" onclick="tab('calendar')">Åbn kalender</button><p class="small muted">*Viser kun aktiviteter, som kan identificeres sikkert med en dato. Ikke alle periodiseringsfelter kan nødvendigvis fortolkes.</p>`}`}
function emptyImport(){return `<div class="empty"><div class="name">Ingen Elastico-data importeret</div><p>Importér en JSON-kopi af desktopversionens data. Appen opretter ikke fiktive spillere.</p><button class="btn" onclick="tab('data')">Gå til import</button></div>`}
function eventCard(e){return `<div class="card"><div class="row"><div><span class="pill">${esc(displayDate(e.date))}</span> <span class="small muted">${esc(e.kind||e.type||e._source)}</span></div><button class="btn tiny sub" onclick="openEvent('${esc(keyEvent(e))}')">Åbn</button></div><div class="name" style="margin-top:9px">${esc(title(e))}</div></div>`}
function keyEvent(e){return allEvents().findIndex(x=>x.date===e.date&&x._source===e._source&&String(x.id??title(x))===String(e.id??title(e))&&String(x.playerId??'')===String(e.playerId??''))}
function calendar(){const es=allEvents().filter(x=>x.date===state.date);return `<div class="h1">Kalender</div><label class="label">Vælg dag</label><input type="date" value="${esc(state.date)}" onchange="setDate(this.value)"><div class="spacer"></div>${!state.data?emptyImport():es.length?es.map(e=>eventCard(e)).join(''):'<div class="empty">Ingen daterede aktiviteter denne dag. Prøv en anden dato.</div>'}<div class="card"><div class="small muted">Fremmøde</div><p>Åbn en aktivitet for at registrere fremmøde lokalt. Registreringer ændrer ikke desktopdata.</p></div>`}
function eventDetail(index){const e=allEvents()[Number(index)];if(!e)return calendar();const bs=content(e);const names=['Opvarmning','Principspil','Udtryksspil','Temaspil/Kamp'];return `<button class="btn ghost tiny" onclick="tab('calendar')">← Kalender</button><div class="h1">${esc(title(e))}</div><div class="small muted">${esc(displayDate(e.date))} · ${esc(e.periodizationName||e.kind||e.type||'Træning')}</div><div class="spacer"></div><div class="card"><h2>Træningsindhold · kun visning</h2>${bs.length?bs.map((b,i)=>`<details ${i===0?'open':''}><summary>${esc(typeof b==='string'?names[i]||'Øvelse '+(i+1):b.name||b.title||b.label||names[i]||'Blok '+(i+1))}</summary><div class="detail">${esc(typeof b==='string'?b:JSON.stringify(b,null,2))}</div></details>`).join(''):'<div class="small muted">Ingen læsbare øvelsesblokke tilknyttet denne aktivitet i importen.</div>'}</div><div class="card"><h2>Fremmøde · lokalt</h2><p class="small muted">Status gemmes kun i denne mobilbrowser og kan eksporteres. Ikke synkroniseret.</p>${players().length?players().map(p=>{const k=attendanceKey(e,p);const val=state.attendance[k]||'';return `<div class="row" style="padding:10px 0;border-top:1px solid #35545c"><span>${esc(p.name)}</span><div class="attendance">${[['present','Mødt'],['absent','Fravær'],['injured','Skadet']].map(([v,l])=>`<button class="${val===v?'selected':''}" onclick="setAttendance('${esc(k)}','${v}',${index})">${l}</button>`).join('')}</div></div>`}).join(''):'<div class="small muted">Ingen spillere på det valgte hold.</div>'}</div>`}
function attendanceKey(e,p){return [e.date,e._source,e.id??title(e),p.id].join('::')}
function teamPage(){return `<div class="h1">Spillere</div>${!state.data?emptyImport():players().length?players().map(p=>`<div class="card row"><div><div class="name">${esc(p.name)}</div><div class="small muted">${esc(p.position||p.pos||'Position ikke angivet')} · ${esc(p.team||teamName(p.teamId))}</div></div><button class="btn tiny sub" onclick="openPlayer('${esc(p.id)}')">Profil</button></div>`).join(''):'<div class="empty">Ingen spillere på holdet.</div>'}`}
function playerPage(){const p=arr(state.data?.players).find(x=>String(x.id)===String(state.selectedPlayer));if(!p)return teamPage();const fields=[['Rygnummer',p.jerseyNumber??p.number??p.shirtNumber],['Trackernummer',p.trackerNumber??p.trackerNo??p.tracker],['Position',p.position??p.pos],['Mål',p.goal]];return `<button class="btn tiny ghost" onclick="tab('team')">← Hold</button><div class="h1">${esc(p.name)}</div><div class="card"><h2>Spillerprofil · kun visning</h2>${fields.map(([l,v])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #31505a"><span class="muted">${esc(l)}</span><b>${esc(v??'—')}</b></div>`).join('')}</div><div class="card"><h2>Performance · kun visning</h2><p class="small muted">Eksisterende felter fra spillerprofilen vises, hvor de findes. Der kan ikke rettes i data.</p>${Object.entries(p).filter(([k,v])=>/phv|cmj|sprint|speed|load|test|matur|height|weight/i.test(k)&&['string','number'].includes(typeof v)).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')||'<div class="small muted">Ingen performancefelter fundet direkte på denne spiller. Målinger i særskilte desktopmoduler er endnu ikke kortlagt til denne visning.</div>'}</div>`}
function dataPage(){const d=state.data||{};return `${coachBridgeUI()}<div class="h1">Data og sikkerhed</div><div class="warning"><b>Vigtigt:</b> Desktop og mobil deler ikke database. Import overskriver mobilens eksisterende snapshot, men ikke dine desktopdata. Lokal fremmødelog bevares ved ny import.</div><div class="spacer"></div><div class="card"><h2>Importér Elastico-data</h2><p class="small muted">Vælg JSON-fil med desktopversionens <code>zenith-demo</code>-data. Filen behandles lokalt på enheden.</p><input type="file" accept=".json,application/json" id="file" onchange="importFile(this.files[0])"><div id="import-status" class="small muted" style="margin-top:10px"></div></div><div class="card"><h2>Importeret snapshot</h2><div class="row"><span>Importeret</span><b>${esc(state.importedAt||'Aldrig')}</b></div><div class="row"><span>Spillere</span><b>${arr(d.players).length}</b></div><div class="row"><span>Hold</span><b>${teams().length}</b></div><div class="row"><span>Programmer</span><b>${arr(d.programs).length}</b></div><div class="row"><span>Kalenderposter</span><b>${arr(d.calendarEvents).length}</b></div><div class="row"><span>Periodiseringer</span><b>${arr(d.periodizations).length}</b></div></div><div class="card"><h2>Eksportér fremmøde</h2><p class="small muted">Eksporterer kun lokale fremmøderegistreringer som JSON. Import i desktopversionen er endnu ikke implementeret.</p><button class="btn full" onclick="exportAttendance()">Eksportér fremmøde (.json)</button><div class="spacer"></div><button class="btn sub full" onclick="exportBackup()">Eksportér mobil-backup (.json)</button></div><div class="card"><h2>Hent data fra desktop</h2><p>Åbn desktop-Elastico på computeren med dine eksisterende data, tryk <b>F12 → Console</b>, og indsæt:</p><div class="detail" style="overflow-wrap:anywhere;background:#0b2026;padding:10px;border-radius:7px">copy(localStorage.getItem('zenith-demo'))</div><p class="small muted">Kopiér resultatet til en UTF-8 tekstfil med endelsen .json. Hvis din browser ikke understøtter <code>copy()</code>, kan du bruge den alternative eksportkode i README-filen. Eksportér kun på en betroet computer, da data kan indeholde personoplysninger om unge spillere.</p></div>`}
function render(){document.title='Elastico · Mobile Coach 0.2';$('#nav').innerHTML=nav();$('#app').innerHTML=header()+(state.tab==='home'?home():state.tab==='calendar'?calendar():state.tab==='event'?eventDetail(state.eventIndex):state.tab==='team'?teamPage():state.tab==='player'?playerPage():dataPage())}
function tab(t){state.tab=t;save();render();window.scrollTo(0,0)}function chooseTeam(t){state.team=t;save();render()}function setDate(t){state.date=t;save();render()}function openEvent(i){state.eventIndex=i;tab('event')}function openPlayer(i){state.selectedPlayer=i;tab('player')}function setAttendance(k,v,i){state.attendance[k]=v;save();state.eventIndex=i;render()}
async function importFile(f){if(!f)return;const msg=$('#import-status');try{if(f.size>15*1024*1024)throw Error('Filen er over 15 MB');const raw=JSON.parse(await f.text());const d=raw?.data&&Array.isArray(raw.data.players)?raw.data:raw;if(!d||typeof d!=='object'||!Array.isArray(d.players))throw Error('JSON indeholder ikke en players-liste fra Elastico');if(!confirm(`Importér ${d.players.length} spillere? Mobilens tidligere datasnapshot erstattes, men lokale fremmøderegistreringer bevares.`))return;state.data=d;state.importedAt=new Date().toLocaleString('da-DK');state.team='all';save();render();$('#import-status').innerHTML='<span class="success">Data importeret.</span>'}catch(e){msg.textContent='Importfejl: '+e.message}}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportAttendance(){download('elastico-mobile-attendance-'+today()+'.json',{format:'elastico-mobile-attendance-v1',exportedAt:new Date().toISOString(),records:state.attendance})}function exportBackup(){download('elastico-mobile-backup-'+today()+'.json',{format:'elastico-mobile-backup-v1',...state})}
render();

/* ELASTICO BRIDGE 0.2 — only demo task and player feedback; never overwrite source snapshots. */
const COACH_BRIDGE_KEY='elastico-mobile-coach-bridge-v02';
function bridgeState(){try{return JSON.parse(localStorage.getItem(COACH_BRIDGE_KEY))||{tasks:[],feedback:[]}}catch(e){return {tasks:[],feedback:[]}}}
function bridgeSave(x){localStorage.setItem(COACH_BRIDGE_KEY,JSON.stringify(x))}
function coachBridgeUI(){const b=bridgeState();return `<div class="h1">Træner → Spiller</div><div class="card"><h2>Opret opgave til Lucas Hessel</h2><p class="small muted">Demointegration · U19 · Lucas Hessel. Ingen automatisk synkronisering.</p><label class="label">Dato</label><input id="bridge-date" type="date" value="${today()}"><label class="label">Træningsopgave</label><input id="bridge-title" style="width:100%;background:#10272e;color:white;border:1px solid #3a626b;border-radius:9px;padding:10px" maxlength="100" value="Acceleration og sprint"><label class="label">Øvelser (én pr. linje)</label><textarea id="bridge-exercises" style="width:100%;min-height:110px;background:#10272e;color:white;border:1px solid #3a626b;border-radius:9px;padding:10px" >A-skips | 2 × 15 m
Acceleration | 5 × 15 m
Flying sprint | 3 × 20 m</textarea><div class="spacer"></div><button class="btn full" onclick="coachCreateTask()">Opret opgave</button></div><div class="card"><h2>Overfør til Player</h2><div class="small muted">Opgaver klar til eksport: ${b.tasks.length}</div><div class="spacer"></div><button class="btn full" onclick="coachExportTasks()" ${b.tasks.length?'':'disabled'}>Eksportér opgaver til Player (JSON)</button></div><div class="card"><h2>Modtag spillerens tilbagemelding</h2><p class="small muted">Importér en svarfil eksporteret fra Player 0.1.3. Eksisterende opgaver og fremmøde ændres ikke.</p><input type="file" accept=".json,application/json" onchange="coachImportFeedback(this.files[0])"><div class="spacer"></div>${b.feedback.length?b.feedback.map(f=>`<div class="detail"><b>${esc(f.title)}</b> · ${esc(displayDate(f.date))}<div>${f.completions.map(c=>esc(c.name)+': '+esc(displayStatus(c.status))).join(' · ')||'Ingen registreringer endnu'}</div></div>`).join(''):'<div class="small muted">Ingen svar importeret endnu.</div>'}</div>`}
function coachCreateTask(){const title=$('#bridge-title')?.value.trim(),date=$('#bridge-date')?.value;const lines=($('#bridge-exercises')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!title||!date||!lines.length){alert('Udfyld dato, titel og mindst én øvelse.');return}const b=bridgeState(),taskId='coach-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);b.tasks.push({id:taskId,date,title,team:'U19',playerName:'Lucas Hessel',exercises:lines.map((s,i)=>{const [name,...rest]=s.split('|');return {id:taskId+'-ex'+i,name:name.trim(),prescription:rest.join('|').trim()}})});bridgeSave(b);render();alert('Opgaven er oprettet og klar til eksport.')}
function coachExportTasks(){const b=bridgeState();download('elastico-coach-til-player-'+today()+'.json',{format:'elastico-coach-player-bridge-v1',direction:'coach-to-player',exportedAt:new Date().toISOString(),tasks:b.tasks})}
async function coachImportFeedback(file){if(!file)return;try{if(file.size>1024*1024)throw Error('Svarfilen er for stor');const x=JSON.parse(await file.text());if(x.format!=='elastico-coach-player-bridge-v1'||x.direction!=='player-to-coach'||!Array.isArray(x.feedback))throw Error('Ikke en gyldig Player-svarfil');const b=bridgeState();for(const f of x.feedback){if(!b.tasks.some(t=>t.id===f.taskId))continue;const safe={taskId:f.taskId,title:String(f.title||'').slice(0,100),date:String(f.date||'').slice(0,10),completions:(Array.isArray(f.completions)?f.completions:[]).slice(0,50).map(c=>({name:String(c.name||'').slice(0,100),status:['done','partial','skipped'].includes(c.status)?c.status:'pending'}))};b.feedback=b.feedback.filter(y=>y.taskId!==safe.taskId);b.feedback.push(safe)}bridgeSave(b);render();alert('Svar importeret.') }catch(e){alert('Importfejl: '+e.message)}}
</script></body></html>
