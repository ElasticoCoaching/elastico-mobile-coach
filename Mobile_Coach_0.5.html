function sessionEditor(){const e=sessionById(state.editingSession);if(!e)return '<div class="empty">Træningspasset blev ikke fundet.</div>';if(e.status==='completed')return mobileSessionDetail(e);const ms=ensureModules(e),ts=teams(),total=ms.reduce((s,m)=>s+moduleTotalMinutes(m),0);return `<button class="btn ghost tiny" onclick="finishSession()">← Kalender</button><div class="h1">Sessionsbygger</div><p class="small muted">Sammensæt dagens træning. Ændringer gemmes automatisk på denne enhed.</p><label class="label">Titel</label><input class="full" value="${esc(e.title||'')}" oninput="changeSession('title',this.value)"><label class="label">Dato</label><input class="full" type="date" value="${esc(e.date)}" onchange="changeSession('date',this.value)"><label class="label">Hold</label><select class="full" onchange="changeSession('teamId',this.value)"><option value="">Ikke valgt</option>${ts.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(e.teamId)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="session-summary"><span class="session-chip">4 moduler</span><span class="session-chip"><span id="session-total">${formatMinutes(total)} samlet</span></span><span class="session-chip">${ms.reduce((s,m)=>s+arr(m.items).length,0)} øvelser</span></div>${ms.map(sessionModuleHtml).join('')}<button class="btn full" onclick="finishSession()">Gem træningspas i kalender</button><p class="small muted">Lokalt gemt. Sessionen kan kopieres og redigeres fra kalenderen. Intet sendes automatisk til Player-appen.</p>`}
function sessionModulesDetail(e){if(!Array.isArray(e.modules))return '';return `<h2>Sessionens fire moduler</h2><div class="session-summary"><span class="session-chip">${formatMinutes(e.modules.reduce((n,m)=>n+moduleTotalMinutes(m),0))} i alt</span></div>${e.modules.map((m,i)=>`<div class="card"><b>${i+1}. ${esc(m.name)}</b><div class="small muted">${formatMinutes(moduleTotalMinutes(m))} min.</div>${arr(m.items).map(x=>`<div style="padding:8px 0;border-top:1px solid #31565c"><strong>${esc(x.name)}</strong> · ${formatMinutes(itemTotalMinutes(x))} min.${Number(x.workSeconds)>0?`<div class="small muted">${Math.max(1,Number(x.sets)||1)} × ${formatMinutes(Number(x.workSeconds)/60)} min. · ${Number(x.restSeconds)||0} sek. pause</div>`:''}<div class="small muted">${esc(x.notes||'')}</div>${x.designId?`<span class="session-chip">Banedesign: ${esc(arr(state.designs).find(d=>String(d.id)===String(x.designId))?.name||'Ikke fundet')}</span>`:''}</div>`).join('')||'<div class="small muted">Ingen øvelser endnu</div>'}</div>`).join('')}`}

function render(){document.title='Elastico · Mobile Coach 0.5';$('#nav').innerHTML=nav();$('#app').innerHTML=header()+(state.tab==='home'?'':'<button class="btn ghost tiny home-return" onclick="goHome()">⌂ Til forsiden</button>')+(state.tab==='home'?home():['development','physical'].includes(state.tab)?upcomingModule():state.tab==='calendar'?calendar():state.tab==='event'?eventDetail(state.eventIndex):state.tab==='training'?trainingPage():state.tab==='library'?libraryPage():state.tab==='designs'?designsPage():state.tab==='design-editor'?designEditor():state.tab==='session-editor'?sessionEditor():state.tab==='team'?teamPage():state.tab==='player'?playerPage():state.tab==='assignments'?assignmentsPage():state.tab==='assignment-editor'?assignmentEditor():dataPage())}
function goHome(){state.editingLibraryExercise=null;state.editingDesign=null;designSelection=null;tab('home')}
function tab(t){state.tab=t;save();render();window.scrollTo(0,0)}function chooseTeam(t){state.team=t;save();render()}function setDate(t){state.date=t;save();render()}function openEvent(i){state.eventIndex=i;tab('event')}function openPlayer(i){state.selectedPlayer=i;tab('player')}function setAttendance(k,v,i){state.attendance[k]=v;save();state.eventIndex=i;render()}
async function importFile(f){if(!f)return;const msg=$('#import-status');try{if(f.size>15*1024*1024)throw Error('Filen er over 15 MB');const raw=JSON.parse(await f.text());const d=raw?.storage?.['zenith-demo']|| (raw?.data&&Array.isArray(raw.data.players)?raw.data:raw);if(!d||typeof d!=='object'||!Array.isArray(d.players))throw Error('JSON indeholder ikke en players-liste fra Elastico');if(!confirm(`Importér ${d.players.length} spillere? Mobilens tidligere datasnapshot erstattes, men lokale fremmøderegistreringer bevares.`))return;state.data=d;state.localPrograms=arr(state.localPrograms);state.localExercises=arr(state.localExercises);state.importedAt=new Date().toLocaleString('da-DK');state.team='all';save();render();$('#import-status').innerHTML='<span class="success">Data importeret.</span>'}catch(e){msg.textContent='Importfejl: '+e.message}}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function restoreBackup(file){if(!file)return;try{if(file.size>15*1024*1024)throw Error('Backup er for stor');const b=JSON.parse(await file.text());if(b.format!=='elastico-mobile-backup-v1'||!Array.isArray(b.localPrograms)||!Array.isArray(b.localExercises)||!Array.isArray(b.localSessions)||!Array.isArray(b.individualAssignments))throw Error('Ugyldigt backupformat');if(!confirm('Gendan denne backup? Alle nuværende lokale data erstattes. Eksportér først en backup af din nuværende version.'))return;const previous=state;const restored={...previous,...b,designs:arr(b.designs),localPrograms:arr(b.localPrograms),localSessions:arr(b.localSessions),localExercises:arr(b.localExercises),individualAssignments:arr(b.individualAssignments),tab:'home',editingDesign:null};state=restored;save();render();alert('Backup gendannet. Kontrollér antal programmer og øvelser.')}catch(e){alert('Gendannelse mislykkedes: '+e.message)}}
function exportDesigns(){download('elastico-spildesigns-'+today()+'.json',{format:'elastico-mobile-designs-v1',designs:arr(state.designs),exercises:arr(state.localExercises).map(e=>({id:e.id,name:e.name,tags:arr(e.tags),designId:e.designId||null}))})}
function exportAttendance(){download('elastico-mobile-attendance-'+today()+'.json',{format:'elastico-mobile-attendance-v1',exportedAt:new Date().toISOString(),records:state.attendance})}function exportBackup(){download('elastico-mobile-backup-'+today()+'.json',{format:'elastico-mobile-backup-v1',...state})}
render();

/* ELASTICO BRIDGE 0.2 — only demo task and player feedback; never overwrite source snapshots. */
const COACH_BRIDGE_KEY='elastico-mobile-coach-bridge-v02';
function bridgeState(){try{return JSON.parse(localStorage.getItem(COACH_BRIDGE_KEY))||{tasks:[],feedback:[]}}catch(e){return {tasks:[],feedback:[]}}}
function bridgeSave(x){localStorage.setItem(COACH_BRIDGE_KEY,JSON.stringify(x));window.elasticoSync?.schedule()}
function coachBridgeUI(){const b=bridgeState();return `<div class="h1">Træner → Spiller</div><div class="card"><h2>Opret opgave til Lucas Hessel</h2><p class="small muted">Demointegration · U19 · Lucas Hessel. Automatisk synkronisering, når du er logget ind.</p><label class="label">Dato</label><input id="bridge-date" type="date" value="${today()}"><label class="label">Træningsopgave</label><input id="bridge-title" style="width:100%;background:#10272e;color:white;border:1px solid #3a626b;border-radius:9px;padding:10px" maxlength="100" value="Acceleration og sprint"><label class="label">Øvelser (én pr. linje)</label><textarea id="bridge-exercises" style="width:100%;min-height:110px;background:#10272e;color:white;border:1px solid #3a626b;border-radius:9px;padding:10px" >A-skips | 2 × 15 m
Acceleration | 5 × 15 m
Flying sprint | 3 × 20 m</textarea><div class="spacer"></div><button class="btn full" onclick="coachCreateTask()">Opret opgave</button></div><div class="card"><h2>Eksportér en planlagt session</h2><p class="small muted">Brug din eksisterende sessionsbygger. Eksportér et træningspas til demo-spilleren Lucas Hessel (U19). Øvelser, modulnavne, intervaller, pauser, instruktioner og tilknyttede spildesigns medtages. Sessionen synkroniseres automatisk, når den tilføjes.</p><label class="label">Vælg session</label><select class="full" id="bridge-session"><option value="">Vælg træningspas…</option>${arr(state.localSessions).filter(s=>s.status!=='completed').map(s=>`<option value="${esc(s.id)}">${esc(s.date)} · ${esc(s.title)}</option>`).join('')}</select><div class="spacer"></div><button class="btn full" onclick="coachExportSessionForPlayer()">Føj session til eksport</button></div><div class="card"><h2>Overfør til Player</h2><div class="small muted">Opgaver klar til eksport: ${b.tasks.length}</div><div class="spacer"></div><button class="btn full" onclick="coachExportTasks()" ${b.tasks.length?'':'disabled'}>Eksportér opgaver til Player (JSON)</button></div><div class="card"><h2>Modtag spillerens tilbagemelding</h2><p class="small muted">Importér en svarfil eksporteret fra Player 0.1.3. Eksisterende opgaver og fremmøde ændres ikke.</p><input type="file" accept=".json,application/json" onchange="coachImportFeedback(this.files[0])"><div class="spacer"></div>${b.feedback.length?b.feedback.map(f=>`<div class="detail"><b>${esc(f.title)}</b> · ${esc(displayDate(f.date))}<div>${f.completions.map(c=>esc(c.name)+': '+esc(displayStatus(c.status))).join(' · ')||'Ingen registreringer endnu'}</div>${f.rpe?`<div>RPE: ${esc(f.rpe)}/10</div>`:''}${f.comment?`<div>Kommentar: ${esc(f.comment)}</div>`:''}</div>`).join(''):'<div class="small muted">Ingen svar importeret endnu.</div>'}</div>`}
function coachCreateTask(){const title=$('#bridge-title')?.value.trim(),date=$('#bridge-date')?.value;const lines=($('#bridge-exercises')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!title||!date||!lines.length){alert('Udfyld dato, titel og mindst én øvelse.');return}const b=bridgeState(),taskId='coach-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);b.tasks.push({id:taskId,date,title,team:'U19',playerName:'Lucas Hessel',exercises:lines.map((s,i)=>{const [name,...rest]=s.split('|');return {id:taskId+'-ex'+i,name:name.trim(),prescription:rest.join('|').trim()}})});bridgeSave(b);render();alert('Opgaven er oprettet og synkroniseres automatisk, når du er logget ind.')}
function coachExportSessionForPlayer(){const id=document.getElementById('bridge-session')?.value;const s=sessionById(id);if(!s){alert('Vælg en session.');return}const items=(Array.isArray(s.modules)?s.modules:[]).flatMap((m,mi)=>arr(m.items).map((it,ii)=>({id:'ex-'+mi+'-'+ii,name:(m.name||'Modul')+' · '+(it.name||'Øvelse'),module:m.name||'',notes:it.notes||'',workSeconds:Number(it.workSeconds)||0,restSeconds:Number(it.restSeconds)||0,sets:Math.max(1,Number(it.sets)||1),minutes:Number(it.minutes)||0,design:arr(state.designs).find(d=>String(d.id)===String(it.designId))||null,prescription:Number(it.workSeconds)>0?`${Math.max(1,Number(it.sets)||1)} × ${Math.floor(Number(it.workSeconds)/60)}:${String(Number(it.workSeconds)%60).padStart(2,'0')} · pause ${Number(it.restSeconds)||0} sek.`:`${Number(it.minutes)||0} min.`})));if(!items.length){alert('Sessionen har ingen øvelser.');return}const b=bridgeState();const existing=b.tasks.find(t=>t.sourceSessionId===s.id);if(existing&&!confirm('Denne session er allerede tilføjet. Vil du erstatte den i eksportlisten?'))return;const idTask=existing?.id||'coach-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);const task={id:idTask,sourceSessionId:s.id,date:s.date,title:s.title,team:'U19',playerName:'Lucas Hessel',exercises:items.map((it,i)=>({...it,id:idTask+'-ex'+i}))};b.tasks=b.tasks.filter(t=>t.sourceSessionId!==s.id);b.tasks.push(task);bridgeSave(b);render();alert('Sessionen er tilføjet og synkroniseres automatisk, når du er logget ind.')}
function coachExportTasks(){const b=bridgeState();download('elastico-coach-til-player-'+today()+'.json',{format:'elastico-coach-player-bridge-v1',direction:'coach-to-player',exportedAt:new Date().toISOString(),tasks:b.tasks})}
async function coachImportFeedback(file){if(!file)return;try{if(file.size>1024*1024)throw Error('Svarfilen er for stor');const x=JSON.parse(await file.text());if(x.format!=='elastico-coach-player-bridge-v1'||x.direction!=='player-to-coach'||!Array.isArray(x.feedback))throw Error('Ikke en gyldig Player-svarfil');const b=bridgeState();for(const f of x.feedback){if(!b.tasks.some(t=>t.id===f.taskId))continue;const safe={taskId:f.taskId,title:String(f.title||'').slice(0,100),date:String(f.date||'').slice(0,10),completions:(Array.isArray(f.completions)?f.completions:[]).slice(0,50).map(c=>({name:String(c.name||'').slice(0,100),status:['done','partial','skipped'].includes(c.status)?c.status:'pending'})),rpe:Number.isInteger(Number(f.rpe))&&Number(f.rpe)>=1&&Number(f.rpe)<=10?Number(f.rpe):null,comment:String(f.comment||'').slice(0,500)};b.feedback=b.feedback.filter(y=>y.taskId!==safe.taskId);b.feedback.push(safe)}bridgeSave(b);render();alert('Svar importeret.') }catch(e){alert('Importfejl: '+e.message)}}
</script><script src="sync-config.js"></script><script src="sync-client.js"></script></body></html>
