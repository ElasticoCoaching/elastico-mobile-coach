:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e6f2f3;background:#0b1b20;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:560px;margin:auto;min-height:100dvh;padding:20px 16px 104px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:11px;letter-spacing:2.2px;color:#83d0d8;font-weight:800}.muted{color:#91adb3}.small{font-size:12px}.h1{font-size:26px;font-weight:750;margin:8px 0 14px}.card{background:#162f37;border:1px solid #2a4b52;border-radius:15px;padding:15px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.pill{display:inline-block;border:1px solid #3a6b73;color:#b7dbe0;border-radius:20px;padding:4px 9px;font-size:11px}.btn{background:#237c89;border:1px solid #3499a5;color:white;border-radius:9px;padding:10px 12px;font-weight:650}.btn.sub{background:#18383f;border-color:#355b63}.btn.ghost{background:transparent;border-color:#385b62;color:#b6d7dc}.btn.tiny{padding:6px 8px;font-size:12px}.full{width:100%}select,input[type=file],input[type=date],input.full,textarea.full{background:#10272e;color:#e6f2f3;border:1px solid #3a626b;border-radius:9px;padding:9px;max-width:100%}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d2229;border-top:1px solid #31505a;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}.nav-inner{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:#9bb6bb;padding:13px 4px 11px;font-size:12px}.nav button.active{color:#83dbe4;font-weight:800}.name{font-size:16px;font-weight:700}.detail{white-space:pre-wrap;line-height:1.5;color:#d5e8eb}details{border-top:1px solid #31505a;padding:11px 0}details:first-child{border:0}summary{cursor:pointer;font-weight:700}.empty{padding:25px 15px;text-align:center;color:#a9c4c8;border:1px dashed #3c6168;border-radius:14px}.attendance{display:flex;gap:5px}.attendance button{font-size:11px;padding:7px 8px;border-radius:7px;background:#19343c;border:1px solid #41646b;color:#c4dde1}.attendance button.selected{background:#2a8d99;border-color:#65bfc8;color:white}.label{display:block;margin:10px 0 5px;color:#aac5ca;font-size:12px}.warning{border-left:3px solid #e6b46b;padding:10px 12px;background:#302c22;color:#f0dcb8;border-radius:7px}.success{border-left:3px solid #65c8a7;padding:10px 12px;background:#153b36;color:#d0f3e5;border-radius:7px}.spacer{height:10px}.tag{background:#183d46;border-radius:5px;padding:3px 7px;margin:2px;display:inline-block;color:#a5e3ea;font-size:11px}h2{font-size:17px;margin:12px 0}.bar{height:7px;border-radius:8px;background:#33525a;overflow:hidden}.bar>div{background:#57b6c0;height:100%}

.pitch-type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 18px}.pitch-type-grid button{background:#193c42;color:#e5f4f2;border:1px solid #41656b;border-radius:10px;padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}.pitch-type-grid span{font-size:25px}.design-four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.design-four button{font-size:12px}.pitch-stage{padding:14px 13px;background:#152e35;border:1px solid #3b6065;border-radius:12px;margin:7px 0}.design-actions button.active{background:#1f8d88}
/* 0.3j: kompakt desktop-inspireret forside */

/* 0.3k: month activity calendar and consistent navigation */
.home-return{display:block;margin:12px 0 8px;border:1px solid #42636b!important;padding:10px 13px!important}

.month-day.has-events{background:#245057;font-weight:700}.month-day.has-events:after{content:'';position:absolute;bottom:4px;left:calc(50% - 2.5px);width:5px;height:5px;background:#dfb85d;border-radius:50%}
.month-day.today{outline:1px solid #d9b260}.month-day.chosen{background:#bd984b;color:#101e22}.month-day.chosen:after{background:#102b31}
.month-day:disabled{opacity:0;pointer-events:none}.month-detail{font-size:12px;margin-top:10px;color:#b9cccd}.month-detail button{margin-top:6px}

.session-exercise .row{gap:6px}.session-exercise input[type=number]{width:85px}.session-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

.session-work-time{display:flex;gap:5px;align-items:end}.session-work-time input{min-width:0}.session-work-time span{padding-bottom:10px;color:#b8cece;font-size:12px}

.session-dose{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.session-dose label{padding:9px 10px;border:1px solid #44636b;border-radius:8px;background:#15343b;display:flex;align-items:center;gap:6px}.session-dose input{accent-color:#d9b260}.session-interval-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0}.session-interval-grid label{font-size:11px;color:#c5d7d7}.session-interval-grid input{width:100%;margin-top:5px;padding:8px 5px;background:#102b31;color:#fff;border:1px solid #527077;border-radius:7px}.session-design-box{margin-top:13px;padding:10px;background:#15333a;border:1px solid #45656b;border-radius:10px}.session-design-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.session-design-actions button{flex:1}.session-exercise input[type=number]{max-width:100%}

'use strict';
const STORE='elastico-mobile-coach-0.3f';const PREVIOUS_STORE='elastico-mobile-coach-0.3e';const $=x=>document.querySelector(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function displayDate(value){const x=String(value||'');const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(x);return m?`${m[3]}/${m[2]}/${m[1]}`:x;} 
function displayStatus(s){return ({done:'Gennemført',partial:'Delvist gennemført',skipped:'Sprunget over',pending:'Afventer'})[s]||s;}
const today=()=>new Date().toLocaleDateString('en-CA');const asDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x||''))?x:null;
const arrSafe=x=>Array.isArray(x)?x:[];let state={data:null,team:'all',tab:'home',date:today(),selectedPlayer:null,attendance:{},importedAt:null,localPrograms:[],editingProgram:null,localSessions:[],editingSession:null,localExercises:[],individualAssignments:[],editingAssignment:null,designs:[],editingDesign:null,designTool:"player",designColor:"#f6d365",libraryTagFilter:"",librarySearch:"",libraryCategory:"all",editingLibraryExercise:null};try{const s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(PREVIOUS_STORE));if(s&&typeof s==='object')state={...state,...s,localPrograms:arrSafe(s.localPrograms),localSessions:arrSafe(s.localSessions),localExercises:arrSafe(s.localExercises),individualAssignments:arrSafe(s.individualAssignments),designs:arrSafe(s.designs)}}catch{}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){alert('Lokal lagring mislykkedes. Eksportér en backup: '+e.message);}};const arr=x=>Array.isArray(x)?x:[];
function teams(){const d=state.data||{};const list=arr(d.teams).map(t=>({id:String(t.id??t.name),name:String(t.name||t.label||'Hold')}));const names=[...new Set(arr(d.players).map(p=>p.team).filter(Boolean))];for(const n of names)if(!list.some(t=>t.name===n))list.push({id:String(n),name:String(n)});return list.sort((a,b)=>a.name.localeCompare(b.name,'da'))}
function teamName(id){return teams().find(t=>String(t.id)===String(id))?.name||String(id||'')}
function players(){return arr(state.data?.players).filter(p=>state.team==='all'||String(p.teamId)===String(state.team)||String(p.team)===teamName(state.team)||String(p.team)===String(state.team)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'da'))}
function eventTeam(e){if(e.teamId!=null)return String(e.teamId);if(e.team)return String(e.team);if(e.playerId!=null){const p=arr(state.data?.players).find(p=>String(p.id)===String(e.playerId));return String(p?.teamId??p?.team??'')}return ''}
function matchesTeam(e){if(state.team==='all')return true;const t=eventTeam(e);return t===String(state.team)||t===teamName(state.team)}
function allEvents(){const d=state.data||{};let e=arr(d.calendarEvents).map(x=>({...x,_source:'calendar'}));for(const s of arr(d.sessions))if(s.date)e.push({...s,_source:'session'});for(const p of arr(d.periodizations)){for(const slot of arr(p.slots)){let date=asDate(slot.date);if(!date&&p.startDate&&Number.isFinite(Number(slot.day))){let x=new Date(p.startDate+'T12:00:00');x.setDate(x.getDate()+Number(slot.day));date=x.toLocaleDateString('en-CA')}if(date)e.push({...slot,date,teamId:slot.teamId??p.teamId,_source:'periodization',periodizationName:p.name})}}for(const x of arr(state.localSessions))e.push({...x,_source:'mobile'});const unique=new Map();for(const x of e){const k=[x._source,x.id??'',x.date,x.playerId??'',x.programId??'',x.name??x.title??''].join('|');if(!unique.has(k))unique.set(k,x)}return [...unique.values()].filter(x=>asDate(x.date)&&matchesTeam(x)).sort((a,b)=>a.date.localeCompare(b.date))}
function title(e){const d=state.data||{};const program=allPrograms().find(p=>String(p.id)===String(e.programId));return e.title||e.name||e.label||program?.name||e.kind||e.type||'Træningsaktivitet'}
function content(e){const d=state.data||{};const p=allPrograms().find(p=>String(p.id)===String(e.programId));let blocks=e.blocks||e.exercises||e.items||p?.blocks||p?.exercises||[];if(typeof blocks==='string')blocks=[blocks];return arr(blocks)}
// 0.4b: display legacy session objects as readable cards without exposing raw JSON.
function legacyValue(v){if(v==null||v==='')return '';if(typeof v==='string'||typeof v==='number')return String(v);return ''}
function legacyField(label,v){const x=legacyValue(v);return x?`<div class="small muted" style="margin-top:7px"><strong>${esc(label)}:</strong> ${esc(x)}</div>`:''}
function legacyBlock(b,i){
 const defaults=['Opvarmning','Principspil','Udtryksspil','Temaspil/Kamp'];
 if(typeof b==='string'||typeof b==='number')return `<details ${i===0?'open':''}><summary>${esc(defaults[i]||'Øvelse '+(i+1))}</summary><div class="detail">${esc(String(b))}</div></details>`;
 if(!b||typeof b!=='object')return '';
 const name=legacyValue(b.name)||legacyValue(b.title)||legacyValue(b.label)||legacyValue(b.exerciseName)||defaults[i]||'Øvelse';
 const textFields=[['Beskrivelse',b.description||b.desc],['Instruktion',b.prescription||b.instructions],['Noter',b.notes||b.note],['Varighed',b.durationMinutes!=null?`${b.durationMinutes} min`:b.duration],['Intensitet',b.intensity],['Fokus',b.focus],['Organisation',b.organization]];
 const sub=[b.exercises,b.items,b.blocks,b.drills].find(Array.isArray);
 const child=sub?.length?`<div style="margin-top:10px">${sub.map((x,j)=>legacyBlock(x,j)).join('')}</div>`:'';
 const design=b.designName||b.pitchDesignName||b.diagramName||(b.designId||b.pitchDesignId?'Tilknyttet spildesign':'');
 const description=textFields.map(([label,v])=>legacyField(label,v)).join('')+legacyField('Spildesign',design);
 return `<details ${i===0?'open':''}><summary>${esc(name)}</summary><div class="detail">${description||(!child?'<span class="small muted">Ingen yderligere øvelsesbeskrivelse registreret.</span>':'')}${child}</div></details>`;
}
function nav(){return ['home','calendar','training','team','data'].map((id,i)=>`<button class="${state.tab===id?'active':''}" onclick="tab('${id}')"><div style="font-size:20px">${['⌂','▦','▤','♟','▥'][i]}</div>${['Hjem','Kalender','Træning','Hold','Data'][i]}</button>`).join('')}
function header(){return `<div class="top"><div><div class="brand">ELASTICO / MOBILE COACH 0.4b</div><div class="small muted">Lokal prototype · Ingen synkronisering</div></div><button class="btn sub tiny" onclick="tab('data')">Import / eksport</button></div><div class="row"><label class="small muted" for="team">Hold</label><select id="team" onchange="chooseTeam(this.value)"><option value="all">Alle hold</option>${teams().map(t=>`<option value="${esc(t.id)}" ${state.team===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`}

let homeMonth=String(today()).slice(0,7);let homeSelected=today();
function shiftHomeMonth(offset){const [y,m]=homeMonth.split('-').map(Number);const d=new Date(y,m-1+offset,1);homeMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;homeSelected=homeMonth+'-01';render()}
function selectHomeDate(d){homeSelected=d;render()}
function openHomeDate(){state.date=homeSelected;tab('calendar')}
function homeMonthCalendar(){const [y,m]=homeMonth.split('-').map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();const offset=(first.getDay()+6)%7;const events=allEvents();const counts={};for(const e of events)if(e.date&&e.date.startsWith(homeMonth))counts[e.date]=(counts[e.date]||0)+1;const dayButtons=Array.from({length:offset},()=>'<span></span>');for(let day=1;day<=days;day++){const date=homeMonth+'-'+String(day).padStart(2,'0');dayButtons.push(`<button type="button" class="month-day ${counts[date]?'has-events':''} ${date===today()?'today':''} ${date===homeSelected?'chosen':''}" onclick="selectHomeDate('${date}')" aria-label="${day}. ${first.toLocaleDateString('da-DK',{month:'long'})}: ${counts[date]||0} aktiviteter">${day}</button>`)}const dayEvents=events.filter(e=>e.date===homeSelected);return `<section class="month-card"><div class="month-head"><button type="button" onclick="shiftHomeMonth(-1)" aria-label="Forrige måned">‹</button><strong>${first.toLocaleDateString('da-DK',{month:'long',year:'numeric'})}</strong><button type="button" onclick="shiftHomeMonth(1)" aria-label="Næste måned">›</button></div><div class="month-grid">${['Man','Tir','Ons','Tor','Fre','Lør','Søn'].map(x=>`<span class="weekday">${x}</span>`).join('')}${dayButtons.join('')}</div><div class="month-detail">${displayDate(homeSelected)} · ${dayEvents.length} ${dayEvents.length===1?'aktivitet':'aktiviteter'}${dayEvents.length?`<div>${dayEvents.slice(0,3).map(e=>`<div>• ${esc(title(e))}</div>`).join('')}</div>`:''}<button type="button" class="btn sub tiny" onclick="openHomeDate()">Åbn dagen i kalenderen</button></div></section>`}

function home(){const ev=allEvents().filter(x=>x.date>=today()).slice(0,2);const tiles=[['calendar','▦','Træningsplan','Ugeplan og træningspas',true],['library','▤','Øvelsesbibliotek','Find og opret øvelser',true],['designs','▣','Spildesigner','Tegn og gem spil',true],['team','♟','Mine hold','Trupper og spillere',true],['development','◫','Spillerudvikling','Tests og progression',false],['physical','◉','Fysisk træning','Programmer og belastning',false]];return `<section class="home-intro"><div class="home-kicker">ELASTICO FOOTBALL COACHING</div><h1>Træneroverblik</h1><p>Vælg dit arbejdsområde</p></section>${homeMonthCalendar()}<div class="home-tiles">${tiles.map(([id,ic,name,desc,live])=>`<button class="home-tile ${live?'':'home-tile-soon'}" onclick="tab('${id}')" aria-label="${name}${live?'':' – under udvikling'}"><span class="home-tile-icon">${ic}</span><strong>${name}</strong><span class="home-tile-desc">${desc}</span>${live?'':'<span class="home-soon">Under udvikling</span>'}</button>`).join('')}</div><section class="home-bottom"><div class="row"><h2>Kommende aktiviteter</h2><button class="btn ghost tiny" onclick="tab('calendar')">Se kalender</button></div>${ev.length?ev.map(x=>eventCard(x)).join(''):'<p class="small muted">Ingen kommende aktiviteter registreret.</p>'}${!state.data?'<button class="btn sub full" onclick="tab(&quot;data&quot;)">Importér data fra Desktop</button>':''}</section>`}
function upcomingModule(){const physical=state.tab==='physical';return `<button class="btn ghost tiny" onclick="tab('home')">← Forside</button><div class="h1">${physical?'Fysisk træning':'Spillerudvikling'}</div><div class="card"><h2>Under udvikling</h2><p class="small muted">Dette område er endnu ikke implementeret i Mobile Coach. Genvejen er en del af den nye forside, men opretter eller ændrer ingen data.</p><button class="btn sub full" onclick="tab('home')">Tilbage til forsiden</button></div>`}

function emptyImport(){return `<div class="empty"><div class="name">Ingen Elastico-data importeret</div><p>Importér en JSON-kopi af desktopversionens data. Appen opretter ikke fiktive spillere.</p><button class="btn" onclick="tab('data')">Gå til import</button></div>`}
function eventCard(e){return `<div class="card"><div class="row"><div><span class="pill">${esc(displayDate(e.date))}</span> <span class="small muted">${esc(e.kind||e.type||e._source)}</span></div><button class="btn tiny sub" onclick="openEvent('${esc(keyEvent(e))}')">Åbn</button></div><div class="name" style="margin-top:9px">${esc(title(e))}</div></div>`}
function keyEvent(e){return allEvents().findIndex(x=>x.date===e.date&&x._source===e._source&&String(x.id??title(x))===String(e.id??title(e))&&String(x.playerId??'')===String(e.playerId??''))}
function calendar(){const es=allEvents().filter(x=>x.date===state.date);return `<div class="h1">Kalender</div><button class="btn full" onclick="newSession()">+ Byg træningssession (4 moduler)</button><div class="spacer"></div><label class="label">Vælg dag</label><input type="date" value="${esc(state.date)}" onchange="setDate(this.value)"><div class="spacer"></div>${es.length?es.map(e=>eventCard(e)).join(''):'<div class="empty">Ingen aktiviteter denne dag.</div>'}<div class="card"><h2>Træningsadministration</h2><p class="small muted">Åbn et mobilt træningspas for at kopiere, flytte, registrere fremmøde eller afslutte det. Gennemførte pas låses.</p></div>`}

function eventDetail(index){const e=allEvents()[Number(index)];if(!e)return calendar();if(e._source==='mobile')return mobileSessionDetail(e);const bs=content(e);const names=['Opvarmning','Principspil','Udtryksspil','Temaspil/Kamp'];return `<button class="btn ghost tiny" onclick="tab('calendar')">← Kalender</button><div class="h1">${esc(title(e))}</div><div class="small muted">${esc(displayDate(e.date))} · ${esc(e.periodizationName||e.kind||e.type||'Træning')}</div><div class="spacer"></div><div class="card"><h2>Træningsindhold · kun visning</h2>${bs.length?bs.map((b,i)=>legacyBlock(b,i)).join(''):'<div class="small muted">Ingen læsbare øvelsesblokke tilknyttet denne aktivitet i importen.</div>'}</div><div class="card"><h2>Fremmøde · lokalt</h2><p class="small muted">Status gemmes kun i denne mobilbrowser og kan eksporteres. Ikke synkroniseret.</p>${players().length?players().map(p=>{const k=attendanceKey(e,p);const val=state.attendance[k]||'';return `<div class="row" style="padding:10px 0;border-top:1px solid #35545c"><span>${esc(p.name)}</span><div class="attendance">${[['present','Mødt'],['absent','Fravær'],['injured','Skadet']].map(([v,l])=>`<button class="${val===v?'selected':''}" onclick="setAttendance('${esc(k)}','${v}',${index})">${l}</button>`).join('')}</div></div>`}).join(''):'<div class="small muted">Ingen spillere på det valgte hold.</div>'}</div>`}
function attendanceKey(e,p){return [e.date,e._source,e.id??title(e),p.id].join('::')}
function teamPage(){return `<div class="h1">Spillere</div><button class="btn sub full" onclick="tab('assignments')">Individuelle programmer · ${arr(state.individualAssignments).length}</button><div class="spacer"></div>${!state.data?emptyImport():players().length?players().map(p=>`<div class="card row"><div><div class="name">${esc(p.name)}</div><div class="small muted">${esc(p.position||p.pos||'Position ikke angivet')} · ${esc(p.team||teamName(p.teamId))}</div></div><button class="btn tiny sub" onclick="openPlayer('${esc(p.id)}')">Profil</button></div>`).join(''):'<div class="empty">Ingen spillere på holdet.</div>'}`}
function playerPage(){const p=arr(state.data?.players).find(x=>String(x.id)===String(state.selectedPlayer));if(!p)return teamPage();const fields=[['Rygnummer',p.jerseyNumber??p.number??p.shirtNumber],['Trackernummer',p.trackerNumber??p.trackerNo??p.tracker],['Position',p.position??p.pos],['Mål',p.goal]];return `<button class="btn tiny ghost" onclick="tab('team')">← Hold</button><div class="h1">${esc(p.name)}</div><div class="card"><h2>Spillerprofil · kun visning</h2>${fields.map(([l,v])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #31505a"><span class="muted">${esc(l)}</span><b>${esc(v??'—')}</b></div>`).join('')}</div><div class="card"><h2>Individuelle træningsprogrammer</h2><button class="btn full" onclick="newAssignment('${esc(p.id)}')">+ Tildel program</button>${assignmentCards(p.id)}</div><div class="card"><h2>Performance · kun visning</h2><p class="small muted">Eksisterende felter fra spillerprofilen vises, hvor de findes. Der kan ikke rettes i data.</p>${Object.entries(p).filter(([k,v])=>/phv|cmj|sprint|speed|load|test|matur|height|weight/i.test(k)&&['string','number'].includes(typeof v)).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')||'<div class="small muted">Ingen performancefelter fundet direkte på denne spiller. Målinger i særskilte desktopmoduler er endnu ikke kortlagt til denne visning.</div>'}</div>`}
function dataPage(){const d=state.data||{};return `${coachBridgeUI()}<div class="h1">Data og sikkerhed</div><div class="warning"><b>Vigtigt:</b> Desktop og mobil deler ikke database. Import overskriver mobilens eksisterende snapshot, men ikke dine desktopdata. Lokal fremmødelog bevares ved ny import.</div><div class="spacer"></div><div class="card"><h2>Importér Elastico-data</h2><p class="small muted">Vælg JSON-fil med desktopversionens <code>zenith-demo</code>-data. Filen behandles lokalt på enheden.</p><input type="file" accept=".json,application/json" id="file" onchange="importFile(this.files[0])"><div id="import-status" class="small muted" style="margin-top:10px"></div></div><div class="card"><h2>Importeret snapshot</h2><div class="row"><span>Importeret</span><b>${esc(state.importedAt||'Aldrig')}</b></div><div class="row"><span>Spillere</span><b>${arr(d.players).length}</b></div><div class="row"><span>Hold</span><b>${teams().length}</b></div><div class="row"><span>Programmer</span><b>${arr(d.programs).length}</b></div><div class="row"><span>Kalenderposter</span><b>${arr(d.calendarEvents).length}</b></div><div class="row"><span>Periodiseringer</span><b>${arr(d.periodizations).length}</b></div></div><div class="card"><h2>Eksportér individuelle programmer</h2><p class="small muted">JSON-eksport til videre integration. Player 0.1.4 understøtter kun direkte import til demo-spilleren Lucas Hessel; øvrige spilleropgaver kræver en senere Player-opdatering.</p><button class="btn full" onclick="exportIndividualAssignments()">Eksportér individuelle programmer (JSON)</button></div><div class="card"><h2>Eksportér træningskalender</h2><p class="small muted">Eksportér planlagte og gennemførte mobile træningspas med øvelser og fremmøde som JSON. Filen importeres ikke automatisk i Desktop.</p><button class="btn full" onclick="exportTrainingCalendar()">Eksportér træningskalender (.json)</button></div><div class="card"><h2>Spildesigns og tags</h2><p class="small muted">Eksportér designs og øvelsestags til separat JSON. Hele indholdet indgår også i mobil-backup.</p><button class="btn sub full" onclick="exportDesigns()">Eksportér spildesigns og tags</button></div><div class="card"><h2>Eksportér fremmøde</h2><p class="small muted">Eksporterer kun lokale fremmøderegistreringer som JSON. Import i desktopversionen er endnu ikke implementeret.</p><button class="btn full" onclick="exportAttendance()">Eksportér fremmøde (.json)</button><div class="spacer"></div><button class="btn sub full" onclick="exportBackup()">Eksportér mobil-backup (.json)</button><div class="spacer"></div><label class="label">Gendan mobil-backup (erstatter lokale data)</label><input type="file" accept=".json,application/json" onchange="restoreBackup(this.files[0])"></div><div class="card"><h2>Hent data fra desktop</h2><p>Åbn desktop-Elastico på computeren med dine eksisterende data, tryk <b>F12 → Console</b>, og indsæt:</p><div class="detail" style="overflow-wrap:anywhere;background:#0b2026;padding:10px;border-radius:7px">copy(localStorage.getItem('zenith-demo'))</div><p class="small muted">Kopiér resultatet til en UTF-8 tekstfil med endelsen .json. Hvis din browser ikke understøtter <code>copy()</code>, kan du bruge den alternative eksportkode i README-filen. Eksportér kun på en betroet computer, da data kan indeholde personoplysninger om unge spillere.</p></div>`}

function allPrograms(){return [...arr(state.data?.programs).map(p=>({...p,_desktop:true})),...arr(state.localPrograms).map(p=>({...p,_local:true}))]}
function programById(id){return allPrograms().find(p=>String(p.id)===String(id))}
function trainingPage(){
 const programs=allPrograms(),editing=state.editingProgram&&programById(state.editingProgram);
 if(editing)return programEditor(editing);
 return `<div class="h1">Programbygger</div><div class="warning small">0.3f · Nye programmer gemmes kun på denne enhed. Eksport er endnu ikke en direkte Desktop-import.</div><div class="spacer"></div><button class="btn full" onclick="newProgram()">+ Nyt træningsprogram</button><div class="spacer"></div><button class="btn sub full" onclick="openLibrary()">Øvelsesbibliotek · søg / opret / redigér</button><div class="spacer"></div><button class="btn sub full" onclick="tab('designs')">Spildesigner · opret / redigér</button><div class="spacer"></div><button class="btn sub full" onclick="newSession()">+ Planlæg træningspas</button><h2>Programmer (${programs.length})</h2>${programs.length?programs.map(p=>`<div class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="small muted">${p._desktop?'Desktop · skrivebeskyttet kilde':'Oprettet på mobil'} · ${arr(p.exercises).length} øvelser</div></div><button class="btn sub tiny" onclick="editProgram('${esc(p.id)}')">${p._desktop?'Kopiér':'Redigér'}</button></div><div class="spacer"></div><button class="btn sub full" onclick="newSession('${esc(p.id)}')">Planlæg i kalender</button></div>`).join(''):'<div class="empty">Ingen programmer endnu. Importér Desktop-data eller opret et nyt.</div>'}<button class="btn ghost full" onclick="exportPrograms()">Eksportér mobilprogrammer (JSON)</button>`;
}
function newProgram(){const p={id:'mobile-'+crypto.randomUUID(),name:'Nyt træningsprogram',focus:'Fodboldtræning',category:'Fodboldtræning',duration:'30 min',exercises:[],assigned:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.localPrograms.push(p);state.editingProgram=p.id;save();render();}
function editProgram(id){let p=programById(id);if(!p)return;if(p._desktop){const { _desktop,...base}=p;p={...structuredClone(base),id:'mobile-'+crypto.randomUUID(),name:p.name+' (mobil kopi)',sourceProgramId:p.id,createdAt:new Date().toISOString()};state.localPrograms.push(p);}state.editingProgram=p.id;save();render();}
function activeProgram(){return arr(state.localPrograms).find(p=>p.id===state.editingProgram)}
function updateProgram(field,value){const p=activeProgram();if(!p)return;p[field]=value;p.updatedAt=new Date().toISOString();save();}
function updateExercise(index,field,value){const p=activeProgram();if(!p||!p.exercises[index])return;p.exercises[index][field]=value;p.updatedAt=new Date().toISOString();save();}
function addExercise(){const p=activeProgram();if(!p)return;const sel=$('#exercise-picker');const lib=allLibraryExercises();const e=lib.find(x=>String(x.id)===sel?.value);p.exercises.push({id:crypto.randomUUID(),name:e?.name||'Ny øvelse',prescription:e?.prescription||'',notes:e?.notes||'',sourceExerciseId:e?.id??null});save();render();}
function moveExercise(i,delta){const p=activeProgram(),j=i+delta;if(!p||j<0||j>=p.exercises.length)return;[p.exercises[i],p.exercises[j]]=[p.exercises[j],p.exercises[i]];save();render();}
function removeExercise(i){const p=activeProgram();if(!p)return;p.exercises.splice(i,1);save();render();}
function deleteProgram(){const p=activeProgram();if(!p||!confirm('Slet det lokale program?'))return;state.localPrograms=state.localPrograms.filter(x=>x.id!==p.id);state.editingProgram=null;save();render();}
function finishProgram(){state.editingProgram=null;save();render();}
function programEditor(p){
 const lib=allLibraryExercises();
 return `<button class="btn ghost tiny" onclick="finishProgram()">← Programmer</button><div class="h1">Redigér program</div><div class="success small">Ændringer gemmes automatisk på denne enhed.</div>
 <label class="label">Programnavn</label><input class="full" value="${esc(p.name)}" oninput="updateProgram('name',this.value)">
 <label class="label">Fokus</label><input class="full" value="${esc(p.focus||'')}" oninput="updateProgram('focus',this.value)">
 <label class="label">Kategori</label><input class="full" value="${esc(p.category||'')}" oninput="updateProgram('category',this.value)">
 <label class="label">Varighed</label><input class="full" value="${esc(p.duration||'')}" oninput="updateProgram('duration',this.value)">
 <h2>Øvelser (${arr(p.exercises).length})</h2>
 ${arr(p.exercises).map((e,i)=>`<div class="card"><div class="row"><strong>Øvelse ${i+1}</strong><div><button class="btn ghost tiny" onclick="moveExercise(${i},-1)" ${i===0?'disabled':''}>↑</button> <button class="btn ghost tiny" onclick="moveExercise(${i},1)" ${i===p.exercises.length-1?'disabled':''}>↓</button> <button class="btn ghost tiny" onclick="removeExercise(${i})">Slet</button></div></div><label class="label">Navn</label><input class="full" value="${esc(e.name)}" oninput="updateExercise(${i},'name',this.value)"><label class="label">Dosering (sæt, reps, intensitet, pause)</label><input class="full" value="${esc(e.prescription||'')}" oninput="updateExercise(${i},'prescription',this.value)"><label class="label">Instruktioner</label><textarea class="full" rows="2" oninput="updateExercise(${i},'notes',this.value)">${esc(e.notes||'')}</textarea></div>`).join('')}
 <div class="card"><label class="label">Vælg øvelse fra biblioteket (Desktop + egne)</label><select id="exercise-picker" class="full"><option value="">+ Opret tom øvelse</option>${lib.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select><div class="spacer"></div><button class="btn full" onclick="addExercise()">+ Tilføj øvelse</button><div class="spacer"></div><button class="btn sub full" onclick="openLibrary()">Administrér øvelsesbibliotek</button></div>
 <button class="btn full" onclick="finishProgram()">Færdig</button><div class="spacer"></div><button class="btn ghost full" onclick="deleteProgram()">Slet lokalt program</button>`;
}

/* 0.3d: searchable combined library; Desktop entries are immutable source records. */
function allLibraryExercises(){const imported=arr(state.data?.exerciseLibrary).map(e=>({...e,_desktop:true}));const own=arr(state.localExercises).map(e=>({...e,_local:true}));return [...imported,...own]}
const CORE_CATEGORIES=['Fodboldtræning','Fysisk træning','Keepertræning','Mentaltræning','Return-to-Play','Opvarmning'];
const SUBCATEGORIES={
 'Fodboldtræning':['Opbygning','Gennembrud/afslutning','Omstillinger','Højt pres','Lavt pres'],
 'Fysisk træning':['Sprint','Styrke','Plyometri','Agility','Kondition','Mobilitet','Core','Restitution','Nedvarmning','Recovery'],
 'Keepertræning':['Positionering','Reaktioner','Greb','Distribution','Indlæg'],
 'Mentaltræning':[], 'Return-to-Play':[], 'Opvarmning':['Aktivering','Koordination','Dynamisk mobilitet','Boldopvarmning']
};
function normalizedCategory(v){return v==='Målmandstræning'?'Keepertræning':v==='Restitution'?'Fysisk træning':v}
function exerciseSubcategory(e){return e.subcategory||(e.category==='Restitution'?'Restitution':'')}
function subcategoryOptions(category,selected){const options=SUBCATEGORIES[normalizedCategory(category)]||[];return ['<option value="">Vælg spiltema / underkategori</option>',...options.map(x=>`<option value="${esc(x)}" ${selected===x?'selected':''}>${esc(x)}</option>`),...(selected&&!options.includes(selected)?[`<option value="${esc(selected)}" selected>${esc(selected)}</option>`]:[])].join('')}
function updateSubcategoryChoices(category){const el=$('#exercise-subcategory');if(el){el.innerHTML=subcategoryOptions(category,'');changeLibraryExercise('subcategory','')}}
function exerciseCategory(e){return normalizedCategory(String(e.category||e.type||e.focus||'Ukategoriseret').trim()||'Ukategoriseret')}
function openLibrary(){state.editingLibraryExercise=null;tab('library')}
function libraryTagFilter(value){state.libraryTagFilter=value;save();renderLibraryResults()}
function librarySearch(value){state.librarySearch=value;save();renderLibraryResults()}
function libraryCategory(value){state.libraryCategory=value;save();renderLibraryResults()}
function filteredLibrary(){const q=String(state.librarySearch||'').trim().toLocaleLowerCase('da');return allLibraryExercises().filter(e=>(state.libraryCategory==='all'||exerciseCategory(e)===state.libraryCategory)&&(!state.libraryTagFilter||arr(e.tags).includes(state.libraryTagFilter))&&(!q||[e.name,e.category,exerciseSubcategory(e),e.description,e.notes,e.prescription,arr(e.tags).join(' ')].some(v=>String(v||'').toLocaleLowerCase('da').includes(q))))}
function renderLibraryResults(){const target=$('#library-results');if(target)target.innerHTML=libraryResults()}
function libraryResults(){const list=filteredLibrary();return `<div class="small muted">${list.length} af ${allLibraryExercises().length} øvelser</div>${list.length?list.map(e=>`<div class="card"><div class="row"><div><div class="name">${esc(e.name||'Unavngiven øvelse')}</div><div class="small muted">${esc(exerciseCategory(e))}${exerciseSubcategory(e)?' / '+esc(exerciseSubcategory(e)):''} · ${e._desktop?'Desktop (skrivebeskyttet)':'Egen øvelse'}</div></div><button class="btn tiny sub" onclick="editLibraryExercise('${esc(e.id)}')">${e._desktop?'Kopiér':'Redigér'}</button></div>${arr(e.tags).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${e.description?`<p class="small">${esc(e.description)}</p>`:''}${e.prescription?`<div class="small muted">${esc(e.prescription)}</div>`:''}</div>`).join(''):'<div class="empty">Ingen øvelser matcher søgningen.</div>'}`}
function libraryPage(){const current=arr(state.localExercises).find(e=>e.id===state.editingLibraryExercise);if(current)return libraryEditor(current);const excludedPhysical=new Set(['sprint','styrke','robusthed','plyometri']);const categories=[...new Set([...CORE_CATEGORIES,...allLibraryExercises().map(exerciseCategory)] .filter(c=>!excludedPhysical.has(String(c).trim().toLowerCase())))];return `<button class="btn ghost tiny" onclick="tab('training')">← Træning</button><div class="h1">Øvelsesbibliotek</div><div class="small muted">Desktop-øvelser kan kopieres. Egne øvelser kan oprettes og redigeres lokalt.</div><div class="spacer"></div><button class="btn full" onclick="newLibraryExercise()">+ Opret egen øvelse</button><label class="label">Søg i navn, beskrivelse og dosering</label><input id="library-search" class="full" placeholder="Søg øvelse …" value="${esc(state.librarySearch)}" oninput="librarySearch(this.value)"><label class="label">Tagfilter</label><select class="full" onchange="libraryTagFilter(this.value)"><option value="">Alle tags</option>${[...new Set(allLibraryExercises().flatMap(e=>arr(e.tags)))].sort().map(t=>`<option value="${esc(t)}" ${state.libraryTagFilter===t?'selected':''}>${esc(t)}</option>`).join('')}</select><label class="label">Kategori</label><select class="full" onchange="libraryCategory(this.value)"><option value="all">Alle kategorier</option>${categories.map(c=>`<option value="${esc(c)}" ${state.libraryCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="spacer"></div><div id="library-results">${libraryResults()}</div>`}
function newLibraryExercise(){const e={id:'exercise-'+crypto.randomUUID(),name:'Ny øvelse',category:'Fodboldtræning',subcategory:'',description:'',prescription:'',notes:'',tags:[],designId:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.localExercises.push(e);state.editingLibraryExercise=e.id;save();render()}
function editLibraryExercise(id){const source=allLibraryExercises().find(e=>String(e.id)===String(id));if(!source)return;let e=source;if(source._desktop){e={id:'exercise-'+crypto.randomUUID(),sourceExerciseId:source.id,name:source.name||'',category:exerciseCategory(source),subcategory:exerciseSubcategory(source),description:source.description||'',prescription:source.prescription||'',notes:source.notes||'',tags:arr(source.tags).slice(),designId:source.designId||null,createdAt:new Date().toISOString()};state.localExercises.push(e)}state.editingLibraryExercise=e.id;save();render()}
function changeLibraryExercise(field,value){const e=arr(state.localExercises).find(e=>e.id===state.editingLibraryExercise);if(!e||!['name','category','subcategory','description','prescription','notes','designId'].includes(field))return;e[field]=value;e.updatedAt=new Date().toISOString();save()}
function updateExerciseTags(value){const e=arr(state.localExercises).find(x=>x.id===state.editingLibraryExercise);if(!e)return;e.tags=[...new Set(value.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,15);save()}
function finishLibraryExercise(){const e=arr(state.localExercises).find(e=>e.id===state.editingLibraryExercise);if(e&&!e.name.trim()){alert('Angiv et navn til øvelsen.');return}state.editingLibraryExercise=null;save();render()}
function deleteLibraryExercise(){const e=arr(state.localExercises).find(e=>e.id===state.editingLibraryExercise);if(!e||!confirm('Slet denne øvelse fra dit lokale bibliotek? Øvelser i eksisterende programmer bevares.'))return;state.localExercises=state.localExercises.filter(x=>x.id!==e.id);state.editingLibraryExercise=null;save();render()}
function libraryEditor(e){return `<button class="btn ghost tiny" onclick="finishLibraryExercise()">← Bibliotek</button><div class="h1">Redigér egen øvelse</div><div class="success small">Ændringer gemmes automatisk lokalt.</div><label class="label">Navn</label><input class="full" value="${esc(e.name)}" oninput="changeLibraryExercise('name',this.value)"><label class="label">Hovedkategori</label><select class="full" onchange="changeLibraryExercise('category',this.value);updateSubcategoryChoices(this.value)">${CORE_CATEGORIES.map(c=>`<option value="${esc(c)}" ${exerciseCategory(e)===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label class="label">Spiltema / underkategori</label><select id="exercise-subcategory" class="full" onchange="changeLibraryExercise('subcategory',this.value)">${subcategoryOptions(exerciseCategory(e),exerciseSubcategory(e))}</select><label class="label">Tags (kommasepareret)</label><input class="full" value="${esc(arr(e.tags).join(', '))}" oninput="updateExerciseTags(this.value)"><label class="label">Tilknyttet spildesign</label><select class="full" onchange="changeLibraryExercise('designId',this.value)"><option value="">Intet design</option>${arr(state.designs).map(d=>`<option value="${esc(d.id)}" ${e.designId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><label class="label">Beskrivelse</label><textarea class="full" rows="3" oninput="changeLibraryExercise('description',this.value)">${esc(e.description||'')}</textarea><label class="label">Standarddosering</label><input class="full" value="${esc(e.prescription||'')}" oninput="changeLibraryExercise('prescription',this.value)"><label class="label">Instruktioner</label><textarea class="full" rows="3" oninput="changeLibraryExercise('notes',this.value)">${esc(e.notes||'')}</textarea><div class="spacer"></div><button class="btn full" onclick="finishLibraryExercise()">Gem og tilbage til bibliotek</button><div class="spacer"></div><button class="btn ghost full" onclick="deleteLibraryExercise()">Slet egen øvelse</button>`}

function sessionById(id){return arr(state.localSessions).find(x=>x.id===id)}
function newSession(programId){const ps=allPrograms(),p=ps.find(x=>String(x.id)===String(programId))||ps[0];if(!p){alert('Opret først et træningsprogram under Træning.');tab('training');return}const ts=teams();const chosen=state.team!=='all'?state.team:(ts[0]?.id||'');if(!chosen){alert('Importér først hold fra Desktop, så træningspasset kan knyttes til et hold.');return}const e={id:'session-'+crypto.randomUUID(),_source:'mobile',date:state.date||today(),teamId:chosen,programId:p.id,title:p.name,exercises:structuredClone(arr(p.exercises)),status:'planned',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.localSessions.push(e);state.editingSession=e.id;save();tab('session-editor')}
function editSession(id){const e=sessionById(id);if(!e||e.status==='completed')return;state.editingSession=id;tab('session-editor')}
function changeSession(field,value){const e=sessionById(state.editingSession);if(!e||e.status==='completed')return;if(field==='programId'){const p=programById(value);if(!p)return;e.programId=p.id;e.title=p.name;e.exercises=structuredClone(arr(p.exercises))}else e[field]=value;e.updatedAt=new Date().toISOString();save()}
function changeSessionExercise(i,field,value){const e=sessionById(state.editingSession);if(!e||e.status==='completed'||!e.exercises[i])return;e.exercises[i][field]=value;e.updatedAt=new Date().toISOString();save()}
function finishSession(){state.designReturn=null;const e=sessionById(state.editingSession);if(e)state.date=e.date;state.editingSession=null;tab('calendar')}
function sessionEditor(){const e=sessionById(state.editingSession);if(!e)return '<div class="empty">Træningspasset blev ikke fundet.</div>';if(e.status==='completed')return mobileSessionDetail(e);const ts=teams(),ps=allPrograms();return `<button class="btn ghost tiny" onclick="finishSession()">← Kalender</button><div class="h1">Planlagt træningspas</div><div class="success small">Dette pas er en selvstændig kopi. Ændringer i programskabelonen påvirker ikke passet.</div><label class="label">Hold</label><select class="full" onchange="changeSession('teamId',this.value)">${ts.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(e.teamId)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><label class="label">Dato</label><input class="full" type="date" value="${esc(e.date)}" onchange="changeSession('date',this.value)"><label class="label">Programskabelon (skift erstatter øvelser i dette pas)</label><select class="full" onchange="if(confirm('Erstat dette pas’ øvelser med skabelonens?')){changeSession('programId',this.value);render()}else render()">${ps.map(p=>`<option value="${esc(p.id)}" ${String(p.id)===String(e.programId)?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label class="label">Titel</label><input class="full" value="${esc(e.title)}" oninput="changeSession('title',this.value)"><h2>Øvelser (${arr(e.exercises).length})</h2>${arr(e.exercises).map((x,i)=>`<div class="card"><label class="label">Øvelse ${i+1}</label><input class="full" value="${esc(x.name||'')}" oninput="changeSessionExercise(${i},'name',this.value)"><label class="label">Dosering</label><input class="full" value="${esc(x.prescription||'')}" oninput="changeSessionExercise(${i},'prescription',this.value)"><label class="label">Instruktion</label><textarea class="full" rows="2" oninput="changeSessionExercise(${i},'notes',this.value)">${esc(x.notes||'')}</textarea></div>`).join('')}<button class="btn full" onclick="finishSession()">Gem og gå til kalender</button><p class="small muted">Gemmes automatisk lokalt. Træningspasset kan redigeres igen fra kalenderen.</p>`}
function sessionPlayers(e){return arr(state.data?.players).filter(p=>String(p.teamId??p.team??'')===String(e.teamId)||String(p.team||'')===teamName(e.teamId)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'da'))}
function sessionAttendanceKey(e,p){return attendanceKey({...e,_source:'mobile'},p)}
function duplicateSession(id){const original=sessionById(id);if(!original)return;const copy=structuredClone(original);copy.id='session-'+crypto.randomUUID();copy.title=original.title+' (kopi)';copy.status='planned';copy.completedAt=null;copy.createdAt=new Date().toISOString();copy.updatedAt=copy.createdAt;copy.exercises=structuredClone(arr(original.exercises));state.localSessions.push(copy);state.editingSession=copy.id;save();tab('session-editor')}
function moveSession(id,date){const e=sessionById(id);if(!e||e.status==='completed'||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;e.date=date;e.updatedAt=new Date().toISOString();state.date=date;save();render()}
function setSessionAttendance(id,playerId,value){const e=sessionById(id);if(!e||e.status==='completed'||!['present','absent','injured',''].includes(value))return;const p=sessionPlayers(e).find(p=>String(p.id)===String(playerId));if(!p)return;const k=sessionAttendanceKey(e,p);if(value)state.attendance[k]=value;else delete state.attendance[k];save();render()}
function completeSession(id){const e=sessionById(id);if(!e||e.status==='completed')return;if(!confirm('Markér passet som gennemført? Indhold, dato og fremmøde låses.'))return;e.status='completed';e.completedAt=new Date().toISOString();e.updatedAt=e.completedAt;e.attendanceSnapshot=sessionPlayers(e).map(p=>({playerId:p.id,playerName:p.name,status:state.attendance[sessionAttendanceKey(e,p)]||'unregistered'}));save();render()}
function exportTrainingCalendar(){const payload={format:'elastico-mobile-calendar-v1',version:'0.3c',exportedAt:new Date().toISOString(),sessions:arr(state.localSessions).map(e=>({id:e.id,date:e.date,teamId:e.teamId,teamName:teamName(e.teamId),programId:e.programId,title:e.title,status:e.status,completedAt:e.completedAt||null,exercises:e.exercises,attendance:e.attendanceSnapshot||sessionPlayers(e).map(p=>({playerId:p.id,playerName:p.name,status:state.attendance[sessionAttendanceKey(e,p)]||'unregistered'}))}))};download('elastico-traeningskalender-'+today()+'.json',payload)}
function mobileSessionDetail(e){const locked=e.status==='completed',roster=locked?(e.attendanceSnapshot||[]):sessionPlayers(e).map(p=>({playerId:p.id,playerName:p.name,status:state.attendance[sessionAttendanceKey(e,p)]||'unregistered'}));return `<button class="btn ghost tiny" onclick="tab('calendar')">← Kalender</button><div class="h1">${esc(e.title)}</div><div class="small muted">${esc(teamName(e.teamId))} · ${esc(displayDate(e.date))} · ${locked?'Gennemført (låst)':'Planlagt'}</div><div class="spacer"></div>${!locked?`<button class="btn full" onclick="editSession('${esc(e.id)}')">Redigér træningspas</button><div class="spacer"></div><button class="btn sub full" onclick="duplicateSession('${esc(e.id)}')">Kopiér træningspas</button><label class="label">Flyt til en anden dato</label><input class="full" type="date" value="${esc(e.date)}" onchange="moveSession('${esc(e.id)}',this.value)">`:''}${sessionModulesDetail(e)}${Array.isArray(e.modules)?'':'<h2>Træningsindhold</h2>'}${(Array.isArray(e.modules)?[]:arr(e.exercises)).map((x,j)=>`<div class="card"><strong>${j+1}. ${esc(x.name)}</strong><div class="small muted">${esc(x.prescription||'')}</div><div class="detail">${esc(x.notes||'')}</div></div>`).join('')||'<div class="empty">Ingen øvelser i dette pas.</div>'}<div class="card"><h2>Fremmøde ${locked?'· låst':''}</h2>${roster.length?roster.map(p=>`<div style="padding:9px 0;border-top:1px solid #35545c"><div class="name">${esc(p.playerName)}</div>${locked?`<span class="small muted">${esc(({present:'Mødt',absent:'Fravær',injured:'Skadet',unregistered:'Ikke registreret'})[p.status]||p.status)}</span>`:`<div class="attendance">${[['present','Mødt'],['absent','Fravær'],['injured','Skadet']].map(([v,l])=>`<button class="${p.status===v?'selected':''}" onclick="setSessionAttendance('${esc(e.id)}','${esc(p.playerId)}','${p.status===v?'':v}')">${l}</button>`).join('')}</div>`}</div>`).join(''):'<div class="small muted">Ingen spillere fundet for dette hold. Kontrollér Desktop-importen og holdtilknytningen.</div>'}</div>${locked?'<div class="success">Træningspasset er gennemført og låst. Historikken ændres ikke ved senere redigering af skabelonen.</div>':`<button class="btn full" onclick="completeSession('${esc(e.id)}')">Markér som gennemført og lås</button>`}`}

function exportPrograms(){download('elastico-mobile-programs-0.3b-'+today()+'.json',{format:'elastico-mobile-programs-v1',exportedAt:new Date().toISOString(),programs:state.localPrograms});}

/* 0.3e – individual assignments are snapshots, not references to mutable templates. */
function allPlayers(){return arr(state.data?.players)}
function playerById(id){return allPlayers().find(p=>String(p.id)===String(id))}
function assignmentById(id){return arr(state.individualAssignments).find(a=>String(a.id)===String(id))}
function assignmentsForPlayer(id){return arr(state.individualAssignments).filter(a=>String(a.playerId)===String(id)).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function assignmentCards(playerId){const items=assignmentsForPlayer(playerId);return items.length?items.map(a=>`<div class="card"><div class="row"><div><b>${esc(a.title)}</b><div class="small muted">${esc(displayDate(a.date))} · ${arr(a.exercises).length} øvelser</div></div><button class="btn tiny sub" onclick="editAssignment('${esc(a.id)}')">Redigér</button></div></div>`).join(''):'<div class="small muted">Ingen individuelle programmer tildelt.</div>'}
function assignmentsPage(){const ps=players(),all=arr(state.individualAssignments).filter(a=>state.team==='all'||String(a.teamId)===String(state.team)||teamName(a.teamId)===teamName(state.team));return `<button class="btn ghost tiny" onclick="tab('team')">← Hold</button><div class="h1">Individuelle programmer</div><p class="small muted">Programmer gemmes lokalt. Desktop-data og eksisterende holdprogrammer ændres ikke.</p><label class="label">Vælg spiller</label><select id="assignment-player" class="full"><option value="">Vælg spiller</option>${ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.team||teamName(p.teamId))}</option>`).join('')}</select><div class="spacer"></div><button class="btn full" onclick="newAssignment($('#assignment-player').value)">+ Tildel individuelt program</button><h2>Tildelinger (${all.length})</h2>${all.map(a=>`<div class="card"><div class="row"><div><b>${esc(a.playerName)}</b><div class="small muted">${esc(a.title)} · ${esc(displayDate(a.date))}</div></div><button class="btn tiny sub" onclick="editAssignment('${esc(a.id)}')">Åbn</button></div></div>`).join('')||'<div class="empty">Ingen individuelle tildelinger endnu.</div>'}`}
function newAssignment(playerId){const p=playerById(playerId);if(!p){alert('Vælg først en spiller fra det importerede hold.');return}const programs=allPrograms();if(!programs.length){alert('Opret eller importér først et træningsprogram.');tab('training');return}const base=programs[0],now=new Date().toISOString();const a={id:'individual-'+crypto.randomUUID(),playerId:String(p.id),playerName:p.name,teamId:String(p.teamId??p.team??''),teamName:p.team||teamName(p.teamId),date:state.date||today(),programId:String(base.id),title:base.name||'Individuel træning',exercises:structuredClone(arr(base.exercises)),createdAt:now,updatedAt:now};state.individualAssignments.push(a);state.editingAssignment=a.id;save();tab('assignment-editor')}
function editAssignment(id){if(!assignmentById(id))return;state.editingAssignment=id;tab('assignment-editor')}
function changeAssignment(field,value){const a=assignmentById(state.editingAssignment);if(!a)return;if(field==='programId'){const p=programById(value);if(!p)return;if(!confirm('Erstat den individuelle øvelsesliste med en kopi af det valgte program?')){render();return}a.programId=String(p.id);a.title=p.name;a.exercises=structuredClone(arr(p.exercises))}else if(['title','date'].includes(field))a[field]=value;else return;a.updatedAt=new Date().toISOString();save();if(field==='programId')render()}
function changeAssignmentExercise(i,field,value){const a=assignmentById(state.editingAssignment);if(!a||!a.exercises[i]||!['name','prescription','notes'].includes(field))return;a.exercises[i][field]=value;a.updatedAt=new Date().toISOString();save()}
function addAssignmentExercise(){const a=assignmentById(state.editingAssignment);if(!a)return;const e=allLibraryExercises().find(x=>String(x.id)===$('#assignment-exercise-picker')?.value);a.exercises.push({id:'ind-ex-'+crypto.randomUUID(),name:e?.name||'Ny øvelse',prescription:e?.prescription||'',notes:e?.notes||'',sourceExerciseId:e?.id??null});a.updatedAt=new Date().toISOString();save();render()}
function removeAssignmentExercise(i){const a=assignmentById(state.editingAssignment);if(!a)return;a.exercises.splice(i,1);a.updatedAt=new Date().toISOString();save();render()}
function deleteAssignment(){const a=assignmentById(state.editingAssignment);if(!a||!confirm('Slet denne individuelle tildeling?'))return;state.individualAssignments=state.individualAssignments.filter(x=>x.id!==a.id);state.editingAssignment=null;save();tab('assignments')}
function finishAssignment(){state.editingAssignment=null;tab('assignments')}
function assignmentEditor(){const a=assignmentById(state.editingAssignment);if(!a)return assignmentsPage();const programs=allPrograms(),lib=allLibraryExercises();return `<button class="btn ghost tiny" onclick="finishAssignment()">← Individuelle programmer</button><div class="h1">Individuel tildeling</div><div class="card"><div class="name">${esc(a.playerName)}</div><div class="small muted">${esc(a.teamName)} · lokal kopi af programmet</div></div><label class="label">Dato</label><input type="date" class="full" value="${esc(a.date)}" onchange="changeAssignment('date',this.value)"><label class="label">Programskabelon (udskiftning nulstiller individuelle ændringer)</label><select class="full" onchange="changeAssignment('programId',this.value)">${programs.map(p=>`<option value="${esc(p.id)}" ${String(a.programId)===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label class="label">Titel</label><input class="full" value="${esc(a.title)}" oninput="changeAssignment('title',this.value)"><h2>Individuelle øvelser (${arr(a.exercises).length})</h2>${arr(a.exercises).map((e,i)=>`<div class="card"><div class="row"><b>Øvelse ${i+1}</b><button class="btn tiny ghost" onclick="removeAssignmentExercise(${i})">Fjern</button></div><label class="label">Navn</label><input class="full" value="${esc(e.name)}" oninput="changeAssignmentExercise(${i},'name',this.value)"><label class="label">Individuel dosering</label><input class="full" value="${esc(e.prescription||'')}" oninput="changeAssignmentExercise(${i},'prescription',this.value)"><label class="label">Instruktioner</label><textarea class="full" rows="2" oninput="changeAssignmentExercise(${i},'notes',this.value)">${esc(e.notes||'')}</textarea></div>`).join('')}<div class="card"><label class="label">Tilføj øvelse fra bibliotek</label><select id="assignment-exercise-picker" class="full"><option value="">Tom øvelse</option>${lib.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select><div class="spacer"></div><button class="btn full" onclick="addAssignmentExercise()">+ Tilføj øvelse</button></div><button class="btn full" onclick="finishAssignment()">Færdig – gem lokalt</button><div class="spacer"></div><button class="btn ghost full" onclick="deleteAssignment()">Slet tildeling</button>`}
function exportIndividualAssignments(){const payload={format:'elastico-individual-assignments-v1',version:'0.3e',exportedAt:new Date().toISOString(),assignments:arr(state.individualAssignments).map(a=>({id:a.id,playerId:a.playerId,playerName:a.playerName,teamId:a.teamId,teamName:a.teamName,date:a.date,programId:a.programId,title:a.title,exercises:a.exercises,createdAt:a.createdAt,updatedAt:a.updatedAt}))};download('elastico-individuelle-programmer-'+today()+'.json',payload)}


/* 21–25: local pitch designer, movable objects, tags, exercise linking, backup export. */
const PITCH_TYPES=['Hel bane','Halv bane','Brugerdefineret','Horst Wein'];
const CONE_COLORS=[['#ff5b24','Orange'],['#f6d42e','Gul'],['#2586e8','Blå'],['#37ae53','Grøn']];
function designsPage(){return `<button class="btn ghost tiny" onclick="tab('training')">← Træning</button><div class="h1">Spildesigner</div><p class="small muted">Vælg banetype, inden du begynder. Designs gemmes lokalt.</p><div class="pitch-type-grid">${PITCH_TYPES.map(t=>`<button onclick="newDesign('${t}')"><span>${t==='Horst Wein'?'▥':t==='Halv bane'?'◧':t==='Brugerdefineret'?'▤':'▣'}</span>${t}</button>`).join('')}</div><h2>Mine designs (${arr(state.designs).length})</h2>${arr(state.designs).map(d=>`<div class="card row"><div><b>${esc(d.name)}</b><div class="small muted">${arr(d.objects).length} elementer · ${esc(d.pitch||'Hel bane')}</div></div><button class="btn tiny sub" onclick="openDesign('${esc(d.id)}')">Åbn</button></div>`).join('')||'<div class="empty">Ingen designs endnu.</div>'}`}
function defaultGoals(type){return type==='Horst Wein'?[{x:5,y:27,rotation:90},{x:95,y:27,rotation:270},{x:5,y:73,rotation:90},{x:95,y:73,rotation:270}].map((p,i)=>({id:crypto.randomUUID(),type:'goal',color:'#ffffff',...p,label:'',goalSize:3})):[]}
function newDesign(type='Hel bane'){if(!PITCH_TYPES.includes(type))type='Hel bane';const d={id:'design-'+crypto.randomUUID(),name:'Nyt spildesign',pitch:type,objects:defaultGoals(type),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.designs=arr(state.designs);state.designs.push(d);state.editingDesign=d.id;designSelection=null;save();tab('design-editor')}
function currentDesign(){return arr(state.designs).find(d=>d.id===state.editingDesign)}
function openDesign(id){state.editingDesign=id;designSelection=null;tab('design-editor')}
function changeDesign(field,value){const d=currentDesign();if(!d||!['name','pitch'].includes(field))return;if(field==='pitch'&&!PITCH_TYPES.includes(value))return;if(field==='pitch'&&d.pitch!==value&&d.objects.length&&!confirm('Skift banetype? Eksisterende elementer bevares, men deres placering kan skulle justeres.'))return;const previous=d.pitch;d[field]=value;if(field==='pitch'&&value==='Horst Wein'&&previous!=='Horst Wein')d.objects.push(...defaultGoals(value));d.updatedAt=new Date().toISOString();save();if(field==='pitch')render()}
function setDesignColor(v){state.designColor=v;save();render()}
let designSelection=null,designDrag=null;
function designCommit(){const d=currentDesign();if(d)d.updatedAt=new Date().toISOString();save()}
function designAdd(type){const d=currentDesign();if(!d)return;const color=(type==='cone'||type==='disc')?(state.coneColor||'#ff5b24'):(state.designColor||'#e85b59');const goalCount=d.objects.filter(x=>x.type==='goal').length;const o={id:crypto.randomUUID(),type,color,x:type==='goal'?50:50,y:type==='goal'?(goalCount%2?95:5):50,rotation:0,label:type==='player'?String(d.objects.filter(x=>x.type==='player').length+1):'',goalSize:3};d.objects.push(o);designSelection=o.id;designCommit();render()}
function designRemove(){const d=currentDesign();if(!d||!designSelection)return;d.objects=d.objects.filter(o=>o.id!==designSelection);designSelection=null;designCommit();render()}
function designDuplicate(){const d=currentDesign(),o=d?.objects.find(x=>x.id===designSelection);if(!o)return;const copy={...o,id:crypto.randomUUID(),x:Math.min(98,o.x+7),y:Math.min(98,o.y+7)};d.objects.push(copy);designSelection=copy.id;designCommit();render()}
function designRotate(deg){const o=currentDesign()?.objects.find(x=>x.id===designSelection);if(!o)return;o.rotation=((o.rotation||0)+deg+360)%360;designCommit();render()}
function designSetSelectedColor(v){const o=currentDesign()?.objects.find(x=>x.id===designSelection);if(!o)return;o.color=v;if(o.type==='cone'||o.type==='disc')state.coneColor=v;else state.designColor=v;designCommit();render()}
function designSetLabel(v){const o=currentDesign()?.objects.find(x=>x.id===designSelection);if(!o)return;o.label=v.slice(0,3);designCommit()}
function designSetGoalSize(v){const o=currentDesign()?.objects.find(x=>x.id===designSelection);if(!o||o.type!=='goal')return;o.goalSize=Number(v);designCommit();render()}
function designPointerDown(e){const el=e.target.closest('[data-piece]');if(!el)return;const o=currentDesign()?.objects.find(x=>x.id===el.dataset.piece);if(!o)return;e.preventDefault();designSelection=o.id;designDrag={id:o.id,pointerId:e.pointerId};const svg=document.getElementById('designPitch');svg?.setPointerCapture(e.pointerId);document.querySelectorAll('[data-piece]').forEach(x=>x.classList.toggle('selected',x.dataset.piece===o.id))}
function designPointerMove(e){if(!designDrag)return;const svg=document.getElementById('designPitch'),o=currentDesign()?.objects.find(x=>x.id===designDrag.id);if(!svg||!o)return;e.preventDefault();const point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const ctm=svg.getScreenCTM();if(!ctm)return;const pt=point.matrixTransform(ctm.inverse());o.x=Math.max(0,Math.min(100,(pt.x-30)/2.4*100/100));o.y=Math.max(0,Math.min(100,(pt.y-30)/(currentDesign()?.pitch==='Halv bane'?1.95:3.4)));const g=svg.querySelector('[data-piece="'+o.id+'"]');if(g)g.setAttribute('transform',`translate(${30+o.x*2.4} ${30+o.y*(currentDesign()?.pitch==='Halv bane'?1.95:3.4)}) rotate(${o.rotation||0})`)}
function designPointerUp(){if(!designDrag)return;designDrag=null;designCommit();render()}
function designSelectPiece(e){const el=e.target.closest('[data-piece]');if(!el)return;designSelection=el.dataset.piece;render()}
function designRemoveLast(){const d=currentDesign();if(!d||!d.objects.length)return;d.objects.pop();designSelection=null;designCommit();render()}
function deleteDesign(){const d=currentDesign();if(!d||!confirm('Slet dette lokale spildesign?'))return;state.designs=state.designs.filter(x=>x.id!==d.id);state.editingDesign=null;save();tab('designs')}
function pitchLines(type){const w='#e5f4e9';const attrs=`fill="none" stroke="${w}" stroke-width="1"`;if(type==='Brugerdefineret')return `<rect x="30" y="30" width="240" height="340" ${attrs}/>`;if(type==='Horst Wein')return `<rect x="30" y="30" width="240" height="340" ${attrs}/><path d="M30 200 H270" ${attrs}/><path d="M30 115 H270 M30 285 H270" stroke="${w}" stroke-width=".65" stroke-dasharray="4 5" opacity=".65"/>`;if(type==='Halv bane')return `<rect x="30" y="30" width="240" height="195" ${attrs}/><rect x="76" y="30" width="148" height="92" ${attrs}/><rect x="112" y="30" width="76" height="34" ${attrs}/><circle cx="150" cy="103" r="2" fill="${w}"/><path d="M111 122 A51 51 0 0 0 189 122" ${attrs}/><path d="M30 225 H270" stroke="${w}" stroke-width="1.6"/>`;return `<rect x="30" y="30" width="240" height="340" ${attrs}/><path d="M30 200 H270" ${attrs}/><circle cx="150" cy="200" r="39" ${attrs}/><circle cx="150" cy="200" r="2" fill="${w}"/><rect x="76" y="30" width="148" height="62" ${attrs}/><rect x="112" y="30" width="76" height="25" ${attrs}/><rect x="76" y="308" width="148" height="62" ${attrs}/><rect x="112" y="345" width="76" height="25" ${attrs}/>`}
function pitchObject(o){const x=30+Number(o.x)*2.4,y=30+Number(o.y)*(currentDesign()?.pitch==='Halv bane'?1.95:3.4),c=/^#[0-9a-f]{6}$/i.test(o.color)?o.color:'#ff5b24';const selected=o.id===designSelection;let shape='';if(o.type==='player')shape=`<circle r="6.6" fill="${c}" stroke="#f6ffff" stroke-width="1.2"/><text y="2.7" font-size="7" font-weight="750" fill="#101c20" text-anchor="middle">${esc(o.label||'')}</text>`;else if(o.type==='disc')shape=`<circle r="4.5" fill="${c}" stroke="#f4f6f1" stroke-opacity=".55" stroke-width=".4"/><circle r="1.25" fill="#256c4a"/>`;else if(o.type==='cone')shape=`<ellipse cy="3" rx="7.2" ry="2.5" fill="${c}" opacity=".78"/><path d="M-7 2.8 Q-5 -1  -3.7 -2.4 Q-2.2 -5 0 -5.1 Q2.2 -5 3.7 -2.4 Q5 -1 7 2.8 Q0 6 -7 2.8Z" fill="${c}" stroke="#ffffff" stroke-opacity=".32" stroke-width=".5"/><ellipse cy="-4.7" rx="2.3" ry=".75" fill="#ffffff" opacity=".24"/><path d="M-5 1 Q0 3 5 1" fill="none" stroke="#ffffff" opacity=".19" stroke-width=".8"/>`;else if(o.type==='ball')shape=`<circle r="5" fill="#f8f8f8" stroke="#162b2d" stroke-width="1"/><path d="M0 -2.6 L2.5 -1 L1.8 2.5 L-1.8 2.5 L-2.5 -1 Z" fill="#27313a"/>`;else if(o.type==='goal'){const sc=(Number(o.goalSize)||3)/3;shape=`<g transform="scale(${Math.min(sc,2)})"><path d="M-12 0 L-12 -7 L12 -7 L12 0" fill="none" stroke="white" stroke-width="1.9"/><path d="M-12 -7 L-9 -11 L9 -11 L12 -7 M-9 -11 L-9 -4 M9 -11 L9 -4 M-9 -4 L9 -4" fill="none" stroke="#d4e6e4" stroke-width=".65"/></g>`}else if(o.type==='run'||o.type==='pass')shape=`<path d="M-19 0 L19 0 M12 -5 L19 0 L12 5" fill="none" stroke="${o.type==='pass'?'#fff':'#ffdf5a'}" stroke-width="1.4" ${o.type==='pass'?'stroke-dasharray="4 3"':''}/>`;return `<g data-piece="${esc(o.id)}" class="design-piece ${selected?'selected':''}" transform="translate(${x} ${y}) rotate(${o.rotation||0})" style="cursor:grab"><circle r="16" fill="transparent"/>${shape}${selected?'<circle r="14" fill="none" stroke="#80e5ff" stroke-width="1" stroke-dasharray="3 3"/>':''}</g>`}
function designEditor(){const d=currentDesign();if(!d)return designsPage();const tools=[['player','●','Spiller'],['ball','⚽','Bold'],['cone','◉','Kegle'],['disc','◎','Flad kegle'],['goal','▱','Mål'],['run','➜','Løb'],['pass','⇢','Aflevering']];const colors=[['#e85b59','Rød'],['#58b6e9','Blå'],['#f6d365','Gul'],['#929aa0','Grå'],['#f4f4f4','Hvid']];const o=d.objects.find(x=>x.id===designSelection);return `<button class="btn ghost tiny" onclick="sessionDesignAttachAndReturn()">← ${state.designReturn?'Tilbage til session':'Mine designs'}</button><div class="h1">Spildesigner</div><input class="full" aria-label="Navn på spildesign" value="${esc(d.name)}" oninput="changeDesign('name',this.value)" style="margin-bottom:9px"><div class="design-switch design-four">${PITCH_TYPES.map(t=>`<button class="${d.pitch===t?'active':''}" onclick="changeDesign('pitch','${t}')">${t}</button>`).join('')}</div><div class="design-tools">${tools.map(([t,ic,name])=>`<button type="button" onclick="designAdd('${t}')" aria-label="Indsæt ${name}"><span>${ic}</span><small>${name}</small></button>`).join('')}</div><div class="design-colors">${colors.map(([c,n])=>`<button type="button" class="${state.designColor===c?'active':''}" style="--swatch:${c}" onclick="setDesignColor('${c}')" aria-label="Vælg spillerfarve ${n}"><span></span></button>`).join('')}</div><div class="small muted">Keglefarve</div><div class="design-colors">${CONE_COLORS.map(([c,n])=>`<button type="button" class="${(state.coneColor||'#ff5b24')===c?'active':''}" style="--swatch:${c}" onclick="state.coneColor='${c}';save();render()" aria-label="Vælg keglefarve ${n}" title="${n}"><span></span></button>`).join('')}</div><p class="small muted" style="margin:5px 0 8px">Tryk for at indsætte. Træk for at flytte. Markér for at dreje, kopiere eller slette.</p><div class="pitch-stage"><svg id="designPitch" viewBox="0 0 300 ${d.pitch==='Halv bane'?255:400}" onclick="designSelectPiece(event)" onpointerdown="designPointerDown(event)" onpointermove="designPointerMove(event)" onpointerup="designPointerUp(event)" onpointercancel="designPointerUp(event)" style="width:100%;display:block;background:repeating-linear-gradient(0deg,#256c4a 0px,#256c4a 42px,#2b7752 42px,#2b7752 84px);border-radius:7px;touch-action:none;user-select:none">${pitchLines(d.pitch)}${d.objects.map(pitchObject).join('')}</svg></div><div class="design-actions" style="margin-top:9px"><button type="button" onclick="designRemoveLast()" ${d.objects.length?'':'disabled'}>↶ Fjern seneste</button><button type="button" onclick="designSelection=null;render()">Fravælg</button>${o?'<button type="button" onclick="designRemove()">✕ Slet markeret</button>':''}</div>${o?`<div class="design-edit"><div class="row" style="justify-content:space-between"><b>Markeret: ${esc(({player:'Spiller',ball:'Bold',cone:'Kegle',disc:'Flad kegle',goal:'Mål',run:'Løbelinje',pass:'Aflevering'})[o.type]||o.type)}</b><button class="btn tiny ghost" onclick="designSelection=null;render()">Luk ×</button></div><div class="design-actions"><button onclick="designRotate(-15)">↶ 15°</button><button onclick="designRotate(15)">↷ 15°</button><button onclick="designDuplicate()">⧉ Kopiér</button><button onclick="designRemove()">✕ Slet</button></div>${o.type==='player'?`<div class="row"><input style="width:65px" aria-label="Spillernummer" maxlength="3" value="${esc(o.label||'')}" oninput="designSetLabel(this.value)"><span class="small muted">Nummer</span></div>`:''}${['player','cone','disc'].includes(o.type)?`<div class="design-colors">${(o.type==='player'?colors:CONE_COLORS).map(([c,n])=>`<button style="--swatch:${c}" onclick="designSetSelectedColor('${c}')" aria-label="Skift til ${n}"><span></span></button>`).join('')}</div>`:''}${o.type==='goal'?`<div class="design-actions">${[3,5,8,11].map(n=>`<button class="${(o.goalSize||3)===n?'active':''}" onclick="designSetGoalSize(${n})">${n}-mål</button>`).join('')}</div>`:''}</div>`:''}<button class="btn full" style="margin-top:12px" onclick="sessionDesignAttachAndReturn()">${state.designReturn?'Gem og knyt til øvelse':'Gem og tilbage'}</button><button class="btn ghost full" style="margin-top:8px" onclick="deleteDesign()">Slet design</button>`}


/* 0.3n: Sessionsbygger, fire faste moduler. Eksisterende sessions uden moduler vises fortsat. */
const SESSION_MODULE_NAMES=['Opvarmning','Principspil','Udtryksspil','Temaspil/Kamp'];
function freshModules(){return SESSION_MODULE_NAMES.map((name,i)=>({id:'module-'+crypto.randomUUID(),name,items:[]}))}
function ensureModules(e){if(!Array.isArray(e.modules)){e.modules=freshModules();if(arr(e.exercises).length){e.modules[0].items=arr(e.exercises).map(x=>({id:'item-'+crypto.randomUUID(),exerciseId:x.id||null,name:x.name||'Øvelse',minutes:0,workSeconds:0,restSeconds:0,sets:1,notes:x.notes||'',designId:x.designId||null}));}save()}return e.modules}
function newSession(programId){const p=allPrograms().find(x=>String(x.id)===String(programId));const ts=teams();const chosen=state.team!=='all'?state.team:(ts[0]?.id||'');const e={id:'session-'+crypto.randomUUID(),_source:'mobile',date:state.date||today(),teamId:chosen,programId:p?.id||null,title:p?.name||'Nyt træningspas',exercises:[],modules:freshModules(),status:'planned',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(p&&arr(p.exercises).length)e.modules[0].items=arr(p.exercises).map(x=>({id:'item-'+crypto.randomUUID(),exerciseId:x.id||null,name:x.name||'Øvelse',minutes:0,workSeconds:0,restSeconds:0,sets:1,notes:x.notes||'',designId:x.designId||null}));state.localSessions.push(e);state.editingSession=e.id;save();tab('session-editor')}
function sessionTouch(e){e.updatedAt=new Date().toISOString();save()}
function moduleAt(e,i){return ensureModules(e)[Number(i)]}
function sessionModuleDuration(i,v){const e=sessionById(state.editingSession),m=e&&moduleAt(e,i);if(!m||e.status==='completed')return;m.duration=Math.max(0,Math.min(240,Number(v)||0));sessionTouch(e)}
function sessionAddExercise(i,exid){const e=sessionById(state.editingSession),m=e&&moduleAt(e,i),x=allLibraryExercises().find(x=>String(x.id)===String(exid));if(!m||!x||e.status==='completed')return;m.items.push({id:'item-'+crypto.randomUUID(),exerciseId:x.id,name:x.name||'Øvelse',minutes:0,workSeconds:0,restSeconds:0,sets:1,notes:x.notes||x.description||'',designId:x.designId||null});sessionTouch(e);render()}
function sessionAddCustom(i){const e=sessionById(state.editingSession),m=e&&moduleAt(e,i);if(!m||e.status==='completed')return;m.items.push({id:'item-'+crypto.randomUUID(),exerciseId:null,name:'Ny øvelse',minutes:0,workSeconds:0,restSeconds:0,sets:1,notes:'',designId:null});sessionTouch(e);render()}
function sessionItemChange(mi,ii,field,value){const e=sessionById(state.editingSession),item=e&&moduleAt(e,mi)?.items?.[ii];if(!item||e.status==='completed'||!['name','minutes','workSeconds','restSeconds','sets','notes','designId'].includes(field))return;if(['minutes','workSeconds','restSeconds','sets'].includes(field)){const n=Number(value);item[field]=Math.max(field==='sets'?1:0,Math.min(field==='sets'?100:field==='minutes'?240:3600,Number.isFinite(n)?n:0));}else item[field]=value;sessionTouch(e);if(['minutes','workSeconds','restSeconds','sets','designId'].includes(field))refreshSessionSummary();}
function sessionWorkTimeChange(mi,ii,unit,value){const e=sessionById(state.editingSession),item=e&&moduleAt(e,mi)?.items?.[ii];if(!item||e.status==='completed')return;const old=Math.max(0,Math.floor(Number(item.workSeconds)||0));const n=Math.max(0,Math.floor(Number(value)||0));const seconds=unit==='minutes'?Math.min(60,n)*60+old%60:Math.floor(old/60)*60+Math.min(59,n);sessionItemChange(mi,ii,'workSeconds',Math.max(1,seconds));refreshSessionSummary()}
function itemTotalMinutes(x){if(Number(x.workSeconds)>0){const sets=Math.max(1,Number(x.sets)||1),work=Math.max(0,Number(x.workSeconds)||0),rest=Math.max(0,Number(x.restSeconds)||0);return (sets*work+Math.max(0,sets-1)*rest)/60;}return Math.max(0,Number(x.minutes)||0)}
function moduleTotalMinutes(m){return arr(m.items).reduce((sum,x)=>sum+itemTotalMinutes(x),0)}
function formatMinutes(n){const sec=Math.round((Number(n)||0)*60);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function refreshSessionSummary(){const e=sessionById(state.editingSession);if(!e)return;const el=document.getElementById('session-total');if(el)el.textContent=formatMinutes(ensureModules(e).reduce((s,m)=>s+moduleTotalMinutes(m),0))+' samlet';const parts=document.querySelectorAll('[data-module-total]');parts.forEach(el=>{const m=ensureModules(e)[Number(el.dataset.moduleTotal)];if(m)el.textContent=formatMinutes(moduleTotalMinutes(m))+' min.'})}
function sessionDesignNew(mi,ii){const e=sessionById(state.editingSession);if(!e)return;state.designReturn={sessionId:e.id,moduleIndex:mi,itemIndex:ii};newDesign('Hel bane')}
function sessionDesignEdit(mi,ii){const e=sessionById(state.editingSession),item=e&&moduleAt(e,mi)?.items?.[ii];if(!item?.designId)return;state.designReturn={sessionId:e.id,moduleIndex:mi,itemIndex:ii};openDesign(item.designId)}
function sessionDesignAttachAndReturn(){const d=currentDesign(),ret=state.designReturn;if(d&&ret){const e=sessionById(ret.sessionId),item=e&&moduleAt(e,ret.moduleIndex)?.items?.[ret.itemIndex];if(item){item.designId=d.id;sessionTouch(e);state.editingSession=e.id;}state.designReturn=null;designSelection=null;tab('session-editor');return}designSelection=null;tab('designs')}

function sessionItemMove(mi,ii,dir){const e=sessionById(state.editingSession),a=e&&moduleAt(e,mi)?.items,j=Number(ii)+Number(dir);if(!a||j<0||j>=a.length||e.status==='completed')return;[a[ii],a[j]]=[a[j],a[ii]];sessionTouch(e);render()}
function sessionItemRemove(mi,ii){const e=sessionById(state.editingSession),a=e&&moduleAt(e,mi)?.items;if(!a||e.status==='completed')return;a.splice(ii,1);sessionTouch(e);render()}
function sessionModuleMove(i,dir){const e=sessionById(state.editingSession),a=e&&ensureModules(e),j=Number(i)+Number(dir);if(!a||j<0||j>=a.length||e.status==='completed')return;[a[i],a[j]]=[a[j],a[i]];sessionTouch(e);render()}
function sessionModuleItemHtml(m,mi,item,ii){const designs=arr(state.designs),design=designs.find(d=>String(d.id)===String(item.designId));const interval=Number(item.workSeconds)>0;return `<div class="session-exercise"><div class="row"><span class="session-chip">Øvelse ${ii+1}</span><div class="session-module-actions"><button onclick="sessionItemMove(${mi},${ii},-1)" aria-label="Flyt op">↑</button><button onclick="sessionItemMove(${mi},${ii},1)" aria-label="Flyt ned">↓</button><button onclick="sessionItemRemove(${mi},${ii})" aria-label="Fjern øvelse">✕</button></div></div><label class="label">Navn</label><input class="full" value="${esc(item.name||'')}" oninput="sessionItemChange(${mi},${ii},'name',this.value)"><div class="small muted" style="margin-top:9px">Dosering – vælg én metode</div><div class="session-dose"><label><input type="radio" name="dose-${mi}-${ii}" ${interval?'':'checked'} onchange="sessionItemChange(${mi},${ii},'workSeconds',0);render()"> Samlet varighed</label><label><input type="radio" name="dose-${mi}-${ii}" ${interval?'checked':''} onchange="sessionItemChange(${mi},${ii},'workSeconds',300);render()"> Intervaller</label></div>${interval?`<div class="session-interval-grid"><label>Spiltid (min. : sek.)<div class="session-work-time"><input aria-label="Spiltid minutter" type="number" inputmode="numeric" min="0" max="60" value="${Math.floor((Number(item.workSeconds)||300)/60)}" onchange="sessionWorkTimeChange(${mi},${ii},'minutes',this.value)"><span>min.</span><input aria-label="Spiltid sekunder" type="number" inputmode="numeric" min="0" max="59" value="${(Number(item.workSeconds)||300)%60}" onchange="sessionWorkTimeChange(${mi},${ii},'seconds',this.value)"><span>sek.</span></div></label><label>Pause (sek.)<input type="number" min="0" max="3600" value="${Number(item.restSeconds)||0}" onchange="sessionItemChange(${mi},${ii},'restSeconds',this.value)"></label><label>Antal intervaller<input type="number" min="1" max="100" value="${Math.max(1,Number(item.sets)||1)}" onchange="sessionItemChange(${mi},${ii},'sets',this.value)"></label></div><div class="small muted">Pause tælles kun mellem intervallerne.</div>`:`<label class="label">Samlet varighed (min.)</label><input type="number" min="0" max="240" value="${Number(item.minutes)||0}" onchange="sessionItemChange(${mi},${ii},'minutes',this.value)">`}<label class="label">Instruktion</label><textarea class="full" rows="2" oninput="sessionItemChange(${mi},${ii},'notes',this.value)">${esc(item.notes||'')}</textarea><div class="session-design-box"><div class="row"><b>Spildesign</b>${design?`<span class="session-chip">${esc(design.name)}</span>`:''}</div><select class="full" onchange="sessionItemChange(${mi},${ii},'designId',this.value);render()"><option value="">Intet spildesign</option>${designs.map(d=>`<option value="${esc(d.id)}" ${String(item.designId)===String(d.id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select><div class="session-design-actions"><button class="btn sub tiny" onclick="sessionDesignNew(${mi},${ii})">+ Tegn nyt</button>${design?`<button class="btn sub tiny" onclick="sessionDesignEdit(${mi},${ii})">Åbn / redigér</button>`:''}</div>${!designs.length?'<p class="small muted">Du har endnu ingen designs. Tryk på Tegn nyt for at oprette et og knytte det til øvelsen.</p>':''}</div></div>`}

function sessionModuleHtml(m,mi){const exercises=allLibraryExercises();return `<section class="session-module"><div class="session-module-head"><strong>${mi+1}. ${esc(m.name)}</strong><div class="session-module-actions"><button onclick="sessionModuleMove(${mi},-1)" aria-label="Flyt modul op">↑</button><button onclick="sessionModuleMove(${mi},1)" aria-label="Flyt modul ned">↓</button></div></div><div class="small muted">Beregnet varighed: <b data-module-total="${mi}">${formatMinutes(moduleTotalMinutes(m))} min.</b></div><div class="small muted" style="margin:8px 0">${arr(m.items).length} øvelser</div>${arr(m.items).map((item,ii)=>sessionModuleItemHtml(m,mi,item,ii)).join('')}<details><summary class="btn sub" style="margin-top:10px">+ Tilføj øvelse fra bibliotek</summary><div class="session-pick">${exercises.map(x=>`<button onclick="sessionAddExercise(${mi},'${esc(x.id)}')">${esc(x.name||'Øvelse')}</button>`).join('')||'<p class="small muted">Ingen biblioteksøvelser endnu.</p>'}</div></details><button class="btn ghost tiny" style="margin-top:9px" onclick="sessionAddCustom(${mi})">+ Opret øvelse i dette modul</button></section>`}
